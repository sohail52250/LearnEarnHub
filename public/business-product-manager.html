<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  line-height:1.6;
  overflow-x:hidden;
}

img{
  max-width:100%;
  height:auto;
}

table{
  display:block;
  overflow-x:auto;
  width:100%;
}

.card{
  width:100%;
  max-width:100%;
}

@media (max-width:768px){
  body{
    font-size:16px;
  }

  h1{
    font-size:24px;
  }

  h2{
    font-size:20px;
  }
}

@media (max-width:480px){
  h1{
    font-size:20px;
  }

  h2{
    font-size:18px;
  }
}
</style>
<title>Business Product Manager</title>
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script src="/business-product-manager.js"></script>
<link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/components/leh-design-system.css">
<link rel="icon" type="image/png" href="/favicon.png">
</head>

<body><div id="global-header"></div>

<div class="card">
<h1>📦 Product Manager</h1>

<input id="name" placeholder="Product Name">
<input id="category" placeholder="Category">
<input id="price" placeholder="Price">
<input id="stock" placeholder="Stock">

<textarea id="description" placeholder="Description"></textarea>

<button onclick="addProduct()">
Save Product (Draft)
</button>

<p id="msg"></p>
</div>

<div class="card">
<h2>Your Products</h2>
<div id="products">
Loading...
</div>
</div>

<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
</body>
</html>
