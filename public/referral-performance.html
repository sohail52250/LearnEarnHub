<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  line-height:1.6;
  overflow-x:hidden;
}

img{
  max-width:100%;
  height:auto;
}

table{
  display:block;
  overflow-x:auto;
  width:100%;
}

.card{
  width:100%;
  max-width:100%;
}

@media (max-width:768px){
  body{
    font-size:16px;
  }

  h1{
    font-size:24px;
  }

  h2{
    font-size:20px;
  }
}

@media (max-width:480px){
  h1{
    font-size:20px;
  }

  h2{
    font-size:18px;
  }
}
</style>
<title>Referral Performance</title>
<link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/components/leh-design-system.css">
</head>


<body><div id="global-header"></div>


<h1>
My Referral Activity
</h1>


<div id="list">
Loading...
</div>


<script src="/business-referral-engine.js"></script>


<script>


async function load(){


const user =
JSON.parse(
localStorage.getItem("user")||"null"
);



const data =
await getMyReferrals(user.id);



document.getElementById("list")
.innerHTML =
data.length
?
data.map(
r=>`

<div class="card">

<h3>
${r.business_name}
</h3>

<p>
Status: ${r.status}
</p>

</div>

`
).join("")
:
"No referrals yet";


}


load();


</script>


<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
</body>
</html>
