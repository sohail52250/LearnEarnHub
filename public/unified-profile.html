<!DOCTYPE html>
<html>
<head>
<meta name="description" content="LearnEarnHub - Learn skills, find opportunities, earn online, and grow your career.">
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:title" content="LearnEarnHub">
<meta property="og:description" content="Learn, Earn and Grow.">
<link rel="canonical" href="https://learn-earnhub.vercel.app/">
<meta charset="UTF-8">
<title>Unified Profile</title>
<link rel="stylesheet" href="/components/leh-design-system.css">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#0f172a">
<link rel="stylesheet" href="/assets/css/learn-earnhub-ui.css">
</head>
<body><div id="global-header"></div>

<h1>Unified Profile</h1>

<form id="profileForm">

<input id="full_name" placeholder="Full Name"><br><br>

<input id="headline" placeholder="Professional Headline"><br><br>

<textarea id="bio" placeholder="Bio"></textarea><br><br>

<input id="skills" placeholder="Skills"><br><br>

<input id="city" placeholder="City"><br><br>

<input id="country" placeholder="Country"><br><br>

<button>Save Profile</button>

</form>

<script>

profileForm.onsubmit=async(e)=>{

e.preventDefault();

await fetch("/api/unified-profile",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

user_id:localStorage.getItem("user_id"),

full_name:full_name.value,

headline:headline.value,

bio:bio.value,

skills:skills.value,

city:city.value,

country:country.value

})

});

alert("Profile saved");

};

</script>

<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
</body>
</html>
