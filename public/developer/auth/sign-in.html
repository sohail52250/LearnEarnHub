<style>
.leh-global-nav{display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:#f5f5f5;border-radius:10px;margin:10px 0}
.leh-global-nav a{padding:8px 12px;border-radius:8px;text-decoration:none;background:white;border:1px solid #ddd;font-size:14px}

<div class="card">
    <h1>Developer Portal</h1>
    <p>Sign in to access LearnEarnHub developer tools and your developer dashboard.</p>
    <input id="email" type="email" autocomplete="email" placeholder="Email">
    <input id="password" type="password" autocomplete="current-password" placeholder="Password">
    <button class="btn btn-primary" onclick="login()">Sign in</button>
    <p id="msg" role="status"></p>
</div>

<script src="/auth-flow-guidance.js"></script>
<script>
const supabaseClient = supabase.createClient(
    "https://srarnaqyoiqotdntzsyc.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNyYXJuYXF5b3lxb3RkbnR6c3ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4ODc0MjgsImV4cCI6MjEwMDQ2MzQyOH0.e8SJDfYz6jLRm_aoy5poUOYApw0OJF3SFKNKeYf4O7k"
);
async function login(){
    const email=document.getElementById("email").value.trim();
    const password=document.getElementById("password").value;
    const msg=document.getElementById("msg");
    if(!email || !password){msg.textContent="Please enter your email and password.";return;}
    const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
    if(error){msg.textContent=error.message;return;}
    if(data.session?.access_token){localStorage.setItem("dev_token",data.session.access_token);}
    window.location.href="/developer/dashboard.html";
}
</script>
