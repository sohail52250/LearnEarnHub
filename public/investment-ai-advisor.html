<!DOCTYPE html>
<html>

<head>

<title>Investment AI Advisor</title>

<meta charset="UTF-8">

<style>

.card{
border:1px solid #ddd;
padding:20px;
margin:10px;
border-radius:12px;
}

</style>

<link rel="stylesheet" href="/components/leh-design-system.css">
<link rel="icon" type="image/png" href="/favicon.png">
</head>


<body><div id="global-header"></div>


<h1>🤖 Investment AI Advisor</h1>


<div id="result">
Loading...
</div>


<script>

let investor_id=

localStorage.getItem("user_id");


fetch(
"/api/investment-ai-advisor?investor_id="+investor_id
)

.then(r=>r.json())

.then(d=>{


result.innerHTML=

`

<div class="card">

<h3>AI Report</h3>

<pre>${d.report}</pre>

</div>


${(d.recommendations||[])

.map(x=>`

<div class="card">

<h3>
Opportunity Match
</h3>

<p>
Score: ${x.score}%
</p>

<p>
Risk: ${x.risk_rating}
</p>

<p>
${x.reason}
</p>

</div>

`).join("")}

`;

});

</script>


<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
</body>

</html>
