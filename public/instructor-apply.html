
<!DOCTYPE html>

<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  line-height:1.6;
  overflow-x:hidden;
}

img{
  max-width:100%;
  height:auto;
}

table{
  display:block;
  overflow-x:auto;
  width:100%;
}

.card{
  width:100%;
  max-width:100%;
}

@media (max-width:768px){
  body{
    font-size:16px;
  }

  h1{
    font-size:24px;
  }

  h2{
    font-size:20px;
  }
}

@media (max-width:480px){
  h1{
    font-size:20px;
  }

  h2{
    font-size:18px;
  }
}
</style>

<title>Become Remote Instructor</title>

<link rel="stylesheet" href="/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="/supabase-config.js"></script>

<script src="/instructor-apply.js"></script>

<link rel="manifest" href="/manifest.json"></head>


<body><div id="global-header"></div>


<div class="card">

<h1>
🎓 Become a Remote Instructor
</h1>


<p>
Share your skills by creating verified learning content.
</p>


<input id="name" placeholder="Full Name">

<br>


<input id="category" placeholder="Skill Category">


<br>


<textarea id="skills" placeholder="Your Skills"></textarea>


<br>


<textarea id="experience" placeholder="Experience"></textarea>


<br>


<textarea id="portfolio" placeholder="Portfolio / Previous Work"></textarea>


<br>


<input id="certificate" placeholder="Certificate URL">


<br>


<button onclick="applyInstructor()">

Submit Application

</button>


</div>


<div class="card"><a href="/instructor-dashboard.html">🎓 Instructor Studio</a></div>
<div id="global-footer"></div><script src="/global-layout.js"></script></body>

</html>
