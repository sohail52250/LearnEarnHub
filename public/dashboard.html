<!DOCTYPE html>
<html>

<head>

<title>LearnEarnHub Dashboard</title>

<style>

body{
font-family:Arial;
background:#f4f7fb;
padding:20px;
}

h1{
text-align:center;
}

.card{
background:white;
padding:20px;
margin:15px auto;
max-width:700px;
border-radius:12px;
box-shadow:0 3px 10px #ccc;
}

.progress{
height:20px;
background:#ddd;
border-radius:10px;
overflow:hidden;
}

.bar{
height:100%;
background:#1565c0;
color:white;
text-align:center;
}

.cert{
background:#e8f5e9;
padding:10px;
border-radius:8px;
margin:8px;
}

</style>

</head>


<body>


<h1>📚 LearnEarnHub Dashboard</h1>


<div id="courses" class="card">

Loading courses...

</div>



<div id="certificates" class="card">

Loading certificates...

</div>



<script>


async function loadDashboard(){


const user_id =
new URLSearchParams(location.search)
.get("user_id");



if(!user_id){

document.body.innerHTML=
"<h2>User ID missing</h2>";

return;

}



const res=await fetch(
"/api/dashboard?user_id="+user_id
);



const data=await res.json();



let html="<h2>My Courses</h2>";



data.courses.forEach(c=>{


html+=`

<h3>${c.title}</h3>

<p>${c.category}</p>

<div class="progress">

<div class="bar" style="width:${c.percentage}%">

${c.percentage}%

</div>

</div>


<p>
${c.completed_lessons}/${c.total_lessons}
Lessons Completed
</p>


<hr>

`;

});


document.getElementById("courses")
.innerHTML=html;



let cert="";



if(data.certificates.length){


cert="<h2>🏆 Certificates</h2>";


data.certificates.forEach(c=>{


cert+=`

<div class="cert">

Certificate:
${c.certificate_code || "Issued"}

<br>

Course ID:
${c.course_id}

</div>

`;


});


}else{


cert="<h2>No certificates yet</h2>";

}



document.getElementById("certificates")
.innerHTML=cert;


}


loadDashboard();


</script>


</body>

</html>
