Loading courses...

Loading certificates...

</div>



<script>



async function loadDashboard() {
  try {
    if (
      !window.supabase ||
      !window.SUPABASE_URL ||
      !window.SUPABASE_ANON_KEY
    ) {
      throw new Error("Supabase configuration is not loaded.");
    }

    const client = window.supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_ANON_KEY
    );

    const { data: authData, error: authError } =
      await client.auth.getUser();

    if (authError || !authData || !authData.user) {
      window.location.replace("/auth/sign-in.html");
      return;
    }

    const user = authData.user;
    const user_id = user.id;

    try {
      localStorage.setItem("user_id", user_id);
      localStorage.setItem("user", JSON.stringify(user));
    } catch (_) {}

    const res = await fetch(
      "/api/dashboard?user_id=" +
      encodeURIComponent(user_id)
    );

    if (!res.ok) {
      throw new Error(
        "Dashboard API returned HTTP " + res.status
      );
    }

    const data = await res.json();

    let html = "My Courses";

    (data.courses || []).forEach(c => {
      const percentage = Number(c.percentage) || 0;

      html += `
        <h3>${c.title || ""}</h3>
        <p>${c.category || ""}</p>
        <div class="progress">
          <div class="bar" style="width:${percentage}%">
            ${percentage}%
          </div>
        </div>
        <p>
          ${Number(c.completed_lessons) || 0}/
          ${Number(c.total_lessons) || 0}
          Lessons Completed
        </p>
        <hr>
      `;
    });

    const coursesElement =
      document.getElementById("courses");

    if (coursesElement) {
      coursesElement.innerHTML = html;
    }

    let cert = "";

    if (
      Array.isArray(data.certificates) &&
      data.certificates.length
    ) {
      cert = "🏆 Certificates";

      data.certificates.forEach(c => {
        cert += `
          <div class="cert">
            Certificate:
            ${c.certificate_code || "Issued"}
            <br>
            Course ID:
            ${c.course_id || ""}
          </div>
        `;
      });
    } else {
      cert = "No certificates yet";
    }

    const certificatesElement =
      document.getElementById("certificates");

    if (certificatesElement) {
      certificatesElement.innerHTML = cert;
    }

  } catch (error) {
    console.error("Dashboard load failed:", error);

    const coursesElement =
      document.getElementById("courses");

    if (coursesElement) {
      coursesElement.innerHTML =
        "Unable to load your dashboard right now.";
    }

    const certificatesElement =
      document.getElementById("certificates");

    if (certificatesElement) {
      certificatesElement.innerHTML =
        "Please sign in again if the problem continues.";
    }
  }
}

loadDashboard();



</script>
