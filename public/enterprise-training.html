<!DOCTYPE html>
<html>

<head>

<title>Enterprise Training LMS</title>

<meta charset="UTF-8">

<style>

.card{
border:1px solid #ddd;
padding:15px;
margin:10px;
}

</style>

<link rel="stylesheet" href="/components/leh-design-system.css">
</head>


<body><div id="global-header"></div>


<h1>
Enterprise Training Management
</h1>


<div class="card">

<h3>
Assign Course
</h3>


<form id="assign">


<input id="employee_id"
placeholder="Employee ID">


<input id="course_id"
placeholder="Course ID">


<button>
Assign Training
</button>


</form>

</div>



<div id="result"></div>



<script>


assign.onsubmit=async(e)=>{

e.preventDefault();


let r=await fetch("/api/enterprise-training",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

enterprise_id:localStorage.getItem("enterprise_id"),

employee_id:employee_id.value,

course_id:course_id.value

})

});


let d=await r.json();

result.innerHTML=JSON.stringify(d);


};


</script>


<div id="global-footer"></div><script src="/global-layout.js"></script></body>

</html>
