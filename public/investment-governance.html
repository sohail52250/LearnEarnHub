<!DOCTYPE html>
<html>

<head>
<meta name="description" content="LearnEarnHub - Learn skills, find opportunities, earn online, and grow your career.">
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:title" content="LearnEarnHub">
<meta property="og:description" content="Learn, Earn and Grow.">
<link rel="canonical" href="https://learn-earnhub.vercel.app/">

<title>Investment Governance Center</title>

<meta charset="UTF-8">

<style>

.card{
border:1px solid #ddd;
padding:20px;
margin:10px;
border-radius:12px;
}

</style>

<link rel="stylesheet" href="/components/leh-design-system.css">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#0f172a">
</head>


<body><div id="global-header"></div>


<h1>🏛 Investment Governance Center</h1>


<div class="card">

<h2>Investor Approval</h2>

<p id="approval">
Loading...
</p>

</div>


<div class="card">

<h2>Funding Agreements</h2>

<p id="agreements">
Loading...
</p>

</div>


<div class="card">

<h2>Investment Documents</h2>

<p id="documents">
Loading...
</p>

</div>


<script>

let investment_id=
new URLSearchParams(location.search)
.get("investment_id");


fetch(
"/api/investment-governance?investment_id="+investment_id
)

.then(r=>r.json())

.then(d=>{

approval.innerHTML=
JSON.stringify(d.approvals||[]);

agreements.innerHTML=
JSON.stringify(d.agreements||[]);

documents.innerHTML=
JSON.stringify(d.documents||[]);

});

</script>


<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
</body>

</html>
