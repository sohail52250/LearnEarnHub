<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your LearnEarnHub Profile</title>

<script src="/js/supabase-config.js"></script>
<style>
body{margin:0;background:#f5f7fb;color:#172033;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.container{max-width:760px;margin:50px auto;padding:20px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:34px;box-shadow:0 14px 45px rgba(15,23,42,.08)}
.head{display:flex;align-items:center;gap:18px;margin-bottom:28px}
.avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;background:#e9eef5;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700}
h1{margin:0 0 6px;font-size:30px}
.muted{color:#667085}
label{display:block;margin:18px 0 7px;font-weight:600}
input,textarea{width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #d0d5dd;border-radius:10px;font:inherit}
textarea{min-height:110px;resize:vertical}
button{margin-top:22px;width:100%;padding:14px;border:0;border-radius:10px;background:#111827;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
button:hover{background:#273449}
.notice{margin-top:16px;padding:12px;border-radius:10px;background:#f0fdf4;color:#166534;display:none}
</style>
<link rel="stylesheet" href="/assets/css/leh-language-system.css">
<script src="/assets/js/leh-language-system.js" defer></script>
</head>
<body>
<div class="container">
<div class="card">
<div class="head">
<img id="avatar" class="avatar" alt="Profile photo" style="display:none">
<div id="avatarText" class="avatar">L</div>
<div>
<h1>Create your profile</h1>
<div id="email" class="muted">Loading account</div>
</div>
</div>

<p class="muted">
Complete your LearnEarnHub profile so your account is ready for learning,
business and earning experiences.
</p>

<label for="fullName">Full name</label>
<input id="fullName" autocomplete="name" placeholder="Your full name">

<label for="username">Username</label>
<input id="username" autocomplete="username" placeholder="Choose a username">

<label for="bio">About you</label>
<textarea id="bio" placeholder="Tell us briefly about yourself, your skills or goals"></textarea>

<label for="location">Location</label>
<input id="location" autocomplete="address-level2" placeholder="City, country">

<button id="save">Save profile and continue</button>
<div id="notice" class="notice"></div>
</div>
</div>

<script>
(async function(){
const client=window.supabaseClient;
if(!client){location.replace("/auth/sign-in.html");return;}

const {data,error}=await client.auth.getSession();
if(error||!data.session){location.replace("/auth/sign-in.html");return;}

const user=data.session.user;
const meta=user.user_metadata||{};
const name=meta.full_name||meta.name||"";
const avatar=meta.avatar_url||meta.picture||"";

document.getElementById("email").textContent=user.email||"";
document.getElementById("fullName").value=name;
document.getElementById("username").value=meta.username||"";
document.getElementById("bio").value=meta.bio||"";
document.getElementById("location").value=meta.location||"";

if(avatar){
const img=document.getElementById("avatar");
img.src=avatar;
img.style.display="block";
document.getElementById("avatarText").style.display="none";
}else{
document.getElementById("avatarText").textContent=(name||user.email||"L").charAt(0).toUpperCase();
}

document.getElementById("save").onclick=async function(){
const button=this;
button.disabled=true;
button.textContent="Saving profile";

const payload={
full_name:document.getElementById("fullName").value.trim(),
username:document.getElementById("username").value.trim(),
bio:document.getElementById("bio").value.trim(),
location:document.getElementById("location").value.trim(),
profile_completed:true
};

const result=await client.auth.updateUser({data:payload});

if(result.error){
alert("Profile could not be saved: "+result.error.message);
button.disabled=false;
button.textContent="Save profile and continue";
return;
}

const n=document.getElementById("notice");
n.textContent="Profile saved successfully.";
n.style.display="block";

setTimeout(function(){
location.replace("/dashboard.html");
},700);
};
})();
</script>
</body>
</html>
