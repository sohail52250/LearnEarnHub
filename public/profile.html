<script>


const user_id=
new URLSearchParams(location.search)
.get("user_id");



async function save(){


let res=await fetch("/api/profile",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

user_id,

full_name:name.value,

avatar_url:avatar.value,

bio:bio.value

})

});


let data=await res.json();


msg.innerText=
"Profile saved ✅";

}


</script>
