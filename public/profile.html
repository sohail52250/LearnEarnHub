<!DOCTYPE html>

<html>

<head>

<title>LearnEarnHub Profile</title>

<style>

body{
font-family:Arial;
background:#f5f7fb;
padding:20px;
}

.box{

background:white;
max-width:500px;
margin:auto;
padding:20px;
border-radius:12px;

}

input,textarea,button{

width:100%;
padding:12px;
margin:8px 0;

}

button{

background:#1565c0;
color:white;
border:0;

}

</style>

</head>


<body>


<div class="box">

<h2>👤 My Profile</h2>


<input id="name" placeholder="Full Name">


<input id="avatar" placeholder="Photo URL">


<textarea id="bio" placeholder="About me"></textarea>


<button onclick="save()">
Save Profile
</button>


<p id="msg"></p>


</div>



<script>


const user_id=
new URLSearchParams(location.search)
.get("user_id");



async function save(){


let res=await fetch("/api/profile",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

user_id,

full_name:name.value,

avatar_url:avatar.value,

bio:bio.value

})

});


let data=await res.json();


msg.innerText=
"Profile saved ✅";

}


</script>


</body>

</html>
