<body>

<style>
.leh-global-nav{
display:flex;
flex-wrap:wrap;
gap:8px;
padding:12px;

<div class="box">

<h2>👤 My Profile</h2>


<input id="name" placeholder="Full Name">


<input id="avatar" placeholder="Photo URL">


<textarea id="bio" placeholder="About me"></textarea>


<button onclick="save()">
Save Profile
</button>


<p id="msg"></p>


</div>



<script>


const user_id=
new URLSearchParams(location.search)
.get("user_id");



async function save(){


let res=await fetch("/api/profile",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

user_id,

full_name:name.value,

avatar_url:avatar.value,

bio:bio.value

})

});


let data=await res.json();


msg.innerText=
"Profile saved ✅";

}


</script>
