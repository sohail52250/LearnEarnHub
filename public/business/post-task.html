<!DOCTYPE html>

<html>

<head>

<title>Post Business Task</title>

<style>

body{
font-family:Arial;
background:#f5f7fb;
padding:20px;
}

.box{

background:white;
padding:20px;
border-radius:12px;

}

input,textarea,button{

width:100%;
padding:10px;
margin:5px;

}

button{

background:#1565c0;
color:white;
border:0;

}

</style>

</head>


<body>
<div class="leh-global-nav">
<a href="/index.html">🏠 Home</a>
<a href="/learn.html">📚 Learn</a>
<a href="/jobs.html">💼 Jobs</a>
<a href="/task-marketplace.html">💰 Tasks</a>
<a href="/marketplace.html">🏪 Marketplace</a>
<a href="/post-job.html">📝 Post Job</a>
<a href="/login.html">🔐 Login</a>
<a href="/developer/login.html">🛠 Developer</a>
</div>
<style>
.leh-global-nav{
display:flex;
flex-wrap:wrap;
gap:8px;
padding:12px;
background:#f5f5f5;
border-radius:10px;
margin:10px 0;
}
.leh-global-nav a{
padding:8px 12px;
border-radius:8px;
text-decoration:none;
background:white;
border:1px solid #ddd;
font-size:14px;
}
</style>



<div class="box">


<h1>🏢 Post Opportunity</h1>


<input id="title" placeholder="Task title">


<input id="skill" placeholder="Required skill">


<textarea id="description" placeholder="Description"></textarea>


<input id="payment" placeholder="Payment">


<button onclick="postTask()">

Post Task

</button>


<p id="msg"></p>


</div>



<script>


async function postTask(){


let r=await fetch(
"/api/employer",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

action:"post",

data:{

title:title.value,

required_skill:skill.value,

description:description.value,

payment:payment.value

}

})

});


let d=await r.json();


msg.innerText=
d.error || "Task posted ✅";


}


</script>


</body>

</html>
