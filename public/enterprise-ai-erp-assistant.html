<!DOCTYPE html>
<html>

<head>
<meta name="description" content="LearnEarnHub - Learn skills, find opportunities, earn online, and grow your career.">
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:title" content="LearnEarnHub">
<meta property="og:description" content="Learn, Earn and Grow.">
<link rel="canonical" href="https://learn-earnhub.vercel.app/">

<title>Enterprise AI ERP Assistant</title>

<meta charset="UTF-8">

<style>

.card{
border:1px solid #ddd;
padding:20px;
margin:10px;
border-radius:12px;
}

</style>

<link rel="stylesheet" href="/components/leh-design-system.css">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#0f172a">
</head>


<body><div id="global-header"></div>


<h1>🤖 Enterprise AI ERP Assistant</h1>


<div class="card">
<h2>AI Insights</h2>
<pre id="insights">Loading...</pre>
</div>


<div class="card">
<h2>Inventory Predictions</h2>
<pre id="inventory">Loading...</pre>
</div>


<div class="card">
<h2>Supplier Risk Alerts</h2>
<pre id="risks">Loading...</pre>
</div>


<div class="card">
<h2>Executive Reports</h2>
<pre id="reports">Loading...</pre>
</div>



<script>

let organization_id =
new URLSearchParams(location.search)
.get("organization_id");


fetch(
"/api/enterprise-ai-erp-assistant?organization_id="+organization_id
)

.then(r=>r.json())

.then(d=>{

insights.innerHTML=
JSON.stringify(d.ai_insights,null,2);

inventory.innerHTML=
JSON.stringify(d.inventory_predictions,null,2);

risks.innerHTML=
JSON.stringify(d.supplier_risk_alerts,null,2);

reports.innerHTML=
JSON.stringify(d.executive_reports,null,2);

});

</script>


<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
</body>

</html>
