<!DOCTYPE html>
<html>
<head>

<title>
Talent Discovery Center
</title>

<link rel="stylesheet" href="/style.css">

</head>

<body>

<div class="card">

<h1>
🎯 Talent Discovery Center
</h1>

<p>
Businesses discover talent.
Applications stay inside the platform.
No direct contact information is shared.
</p>

</div>

<div id="learners">
Loading...
</div>

<script src="/business-learner-matching.js"></script>

<script>

async function load(){

let results=
await findLearnersForBusiness([
"excel",
"marketing",
"freelancing"
]);

document.getElementById("learners")
.innerHTML=

results.map(l=>`

<div class="card">

<h3>
${l.full_name || "Learner"}
</h3>

<p>
Match Score:
${l.match_score || 0}%
</p>

<p>
Skills:
${(l.skills||[]).join(", ")}
</p>

<p>
Certificates:
${l.certificates || 0}
</p>

<p>
Status:
Available For Opportunities
</p>

</div>

`).join("");

}

load();

</script>

</body>
</html>
