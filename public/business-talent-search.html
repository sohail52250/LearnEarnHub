<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  line-height:1.6;
  overflow-x:hidden;
}

img{
  max-width:100%;
  height:auto;
}

table{
  display:block;
  overflow-x:auto;
  width:100%;
}

.card{
  width:100%;
  max-width:100%;
}

@media (max-width:768px){
  body{
    font-size:16px;
  }

  h1{
    font-size:24px;
  }

  h2{
    font-size:20px;
  }
}

@media (max-width:480px){
  h1{
    font-size:20px;
  }

  h2{
    font-size:18px;
  }
}
</style>

<title>
Talent Discovery Center
</title>

<link rel="stylesheet" href="/style.css">

<link rel="manifest" href="/manifest.json"></head>

<body><div id="global-header"></div>

<div class="card">

<h1>
🎯 Talent Discovery Center
</h1>

<p>
Businesses discover talent.
Applications stay inside the platform.
No direct contact information is shared.
</p>

</div>

<div id="learners">
Loading...
</div>

<script src="/business-learner-matching.js"></script>

<script>

async function load(){

let results=
await findLearnersForBusiness([
"excel",
"marketing",
"freelancing"
]);

document.getElementById("learners")
.innerHTML=

results.map(l=>`

<div class="card">

<h3>
${l.full_name || "Learner"}
</h3>

<p>
Match Score:
${l.match_score || 0}%
</p>

<p>
Skills:
${(l.skills||[]).join(", ")}
</p>

<p>
Certificates:
${l.certificates || 0}
</p>

<p>
Status:
Available For Opportunities
</p>

</div>

`).join("");

}

load();

</script>

<div id="global-footer"></div><script src="/global-layout.js"></script></body>
</html>
