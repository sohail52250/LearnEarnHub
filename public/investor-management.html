<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  line-height:1.6;
  overflow-x:hidden;
}

img{
  max-width:100%;
  height:auto;
}

table{
  display:block;
  overflow-x:auto;
  width:100%;
}

.card{
  width:100%;
  max-width:100%;
}

@media (max-width:768px){
  body{
    font-size:16px;
  }

  h1{
    font-size:24px;
  }

  h2{
    font-size:20px;
  }
}

@media (max-width:480px){
  h1{
    font-size:20px;
  }

  h2{
    font-size:18px;
  }
}
</style>

<title>Investor Management</title>

<link rel="stylesheet" href="/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="/supabase-config.js"></script>

<link rel="manifest" href="/manifest.json"></head>


<body>


<div class="card">

<h1>📈 Investor & Shareholder Management</h1>


<input id="company_id"
placeholder="Company ID">


<input id="investor_name"
placeholder="Investor Name">


<input id="investment"
type="number"
placeholder="Investment PKR">


<input id="share"
type="number"
placeholder="Ownership %">


<button onclick="addInvestor()">
Add Investor
</button>


<p id="message"></p>


</div>



<script>


async function addInvestor(){


const client=supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);



const {error}=await client
.from("company_investors")
.insert({

company_id:
document.getElementById("company_id").value,

investor_name:
document.getElementById("investor_name").value,

investment_amount:
Number(document.getElementById("investment").value),

ownership_percentage:
Number(document.getElementById("share").value),

status:"active"

});



document.getElementById("message")
.innerHTML=

error ? error.message :
"✅ Investor added";


}


</script>


</body>
</html>
