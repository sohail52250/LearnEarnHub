<!DOCTYPE html>
<html>

<head>
<meta name="description" content="LearnEarnHub - Learn skills, find opportunities, earn online, and grow your career.">
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:title" content="LearnEarnHub">
<meta property="og:description" content="Learn, Earn and Grow.">
<link rel="canonical" href="https://learn-earnhub.vercel.app/">

<title>Investment Analytics</title>

<meta charset="UTF-8">

<style>

.card{
border:1px solid #ddd;
padding:20px;
margin:10px;
border-radius:12px;
}

</style>

<link rel="stylesheet" href="/components/leh-design-system.css">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#0f172a">
<link rel="stylesheet" href="/assets/css/learn-earnhub-ui.css">
</head>


<body><div id="global-header"></div>


<h1>📊 Investment Reports & Analytics</h1>


<div id="report">

Loading...

</div>


<script>


let investor_id=

localStorage.getItem("user_id");


fetch(
"/api/investment-analytics?investor_id="+investor_id
)

.then(r=>r.json())

.then(d=>{


report.innerHTML=`

<div class="card">

<h3>Total Investment</h3>

${d.report.total_investment}

</div>


<div class="card">

<h3>Total Return</h3>

${d.report.total_return}

</div>


<div class="card">

<h3>ROI</h3>

${d.report.roi_percent}%

</div>


<div class="card">

<h3>Risk Level</h3>

${d.report.risk_level}

</div>

`;

});


</script>


<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
</body>

</html>
