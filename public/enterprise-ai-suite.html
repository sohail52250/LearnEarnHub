<!DOCTYPE html>
<html>

<head>

<title>Enterprise AI Investment Suite</title>

<meta charset="UTF-8">

<style>

.card{
border:1px solid #ddd;
padding:20px;
margin:10px;
border-radius:12px;
}

</style>

</head>


<body>


<h1>🤖 Enterprise AI Investment Suite</h1>


<div class="card">

<h2>AI Reports</h2>

<pre id="reports">
Loading...
</pre>

</div>


<div class="card">

<h2>Due Diligence</h2>

<pre id="diligence">
Loading...
</pre>

</div>


<div class="card">

<h2>Risk Scores</h2>

<pre id="risks">
Loading...
</pre>

</div>


<div class="card">

<h2>Executive Metrics</h2>

<pre id="metrics">
Loading...
</pre>

</div>



<script>

let organization_id =
new URLSearchParams(location.search)
.get("organization_id");


fetch(
"/api/enterprise-ai-suite?organization_id="+organization_id
)

.then(r=>r.json())

.then(d=>{


reports.innerHTML=
JSON.stringify(d.ai_reports,null,2);


diligence.innerHTML=
JSON.stringify(d.due_diligence,null,2);


risks.innerHTML=
JSON.stringify(d.risk_scores,null,2);


metrics.innerHTML=
JSON.stringify(d.executive_metrics,null,2);


});

</script>


</body>

</html>
