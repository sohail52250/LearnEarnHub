<!DOCTYPE html>
<html>

<head>

<title>AI Business Valuation</title>

<meta charset="UTF-8">

<style>

.card{
border:1px solid #ddd;
padding:15px;
margin:10px;
border-radius:12px;
}

</style>

</head>


<body><div id="global-header"></div>


<h1>📊 AI Business Valuation Engine</h1>


<div class="card">


<input id="business_id"
placeholder="Business ID">


<input id="revenue"
placeholder="Annual Revenue">


<input id="profit"
placeholder="Annual Profit">


<input id="assets"
placeholder="Assets Value">


<input id="risk_score"
placeholder="Risk Score 0-100">


<button onclick="calculate()">
Generate Valuation
</button>


</div>


<div class="card">

<h2>
AI Report
</h2>

<pre id="report">
</pre>

</div>



<script>


async function calculate(){


let r=await fetch("/api/ai-valuation",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

business_id:business_id.value,

revenue:revenue.value,

profit:profit.value,

assets:assets.value,

risk_score:risk_score.value

})

});


let d=await r.json();


report.innerHTML=d.report;


}


</script>


<div id="global-footer"></div><script src="/global-layout.js"></script></body>

</html>
