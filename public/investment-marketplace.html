<!DOCTYPE html>
<html>

<head>
<meta name="description" content="LearnEarnHub - Learn skills, find opportunities, earn online, and grow your career.">
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:title" content="LearnEarnHub">
<meta property="og:description" content="Learn, Earn and Grow.">
<link rel="canonical" href="https://learn-earnhub.vercel.app/">

<title>Investment Marketplace</title>

<meta charset="UTF-8">

<style>

.card{
border:1px solid #ddd;
padding:20px;
margin:10px;
border-radius:12px;
}

</style>

<link rel="stylesheet" href="/components/leh-design-system.css">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#0f172a">
</head>

<body><div id="global-header"></div>


<h1>💼 Investment Marketplace</h1>


<div id="rounds">
Loading...
</div>


<script>

fetch("/api/investment-marketplace")

.then(r=>r.json())

.then(d=>{


rounds.innerHTML=(d.rounds||[])

.map(r=>`

<div class="card">

<h3>
${r.round_name}
</h3>

<p>
Target: ${r.target_amount}
</p>

<p>
Raised: ${r.raised_amount}
</p>

<p>
Status: ${r.status}
</p>

</div>

`)

.join("");

});

</script>


<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
</body>

</html>
