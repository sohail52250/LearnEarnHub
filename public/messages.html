<!DOCTYPE html>
<html>
<head>
<title>Messages</title>
</head>
<body>
<h1>Messages</h1>

<textarea id="msg"></textarea>
<button onclick="sendMsg()">Send</button>

<script>
async function sendMsg(){

await fetch("/api/messages",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

sender_id:localStorage.getItem("user_id"),

receiver_id:"demo",

message:msg.value

})

});

alert("Message sent");

}
</script>

</body>
</html>
