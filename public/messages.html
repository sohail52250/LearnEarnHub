<!DOCTYPE html>
<html>
<head>
<meta name="description" content="LearnEarnHub - Learn skills, find opportunities, earn online, and grow your career.">
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:title" content="LearnEarnHub">

<link rel="canonical" href="https://learn-earnhub.vercel.app/">
<title>Messages</title>
<link rel="stylesheet" href="/components/leh-design-system.css">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#0f172a">
<link rel="stylesheet" href="/assets/css/learn-earnhub-ui.css">
</head>
<body><div id="global-header"></div>
<h1>Messages</h1>

<textarea id="msg"></textarea>
<button onclick="sendMsg()">Send</button>

<script>
async function sendMsg(){

await fetch("/api/messages",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

sender_id:localStorage.getItem("user_id"),

receiver_id:"demo",

message:msg.value

})

});

alert("Message sent");

}
</script>

<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
</body>
</html>
