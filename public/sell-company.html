<!DOCTYPE html>
<html>
<head>
<meta name="description" content="LearnEarnHub - Learn skills, find opportunities, earn online, and grow your career.">
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:title" content="LearnEarnHub">
<meta property="og:description" content="Learn, Earn and Grow.">
<link rel="canonical" href="https://learn-earnhub.vercel.app/">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  line-height:1.6;
  overflow-x:hidden;
}

img{
  max-width:100%;
  height:auto;
}

table{
  display:block;
  overflow-x:auto;
  width:100%;
}

.card{
  width:100%;
  max-width:100%;
}

@media (max-width:768px){
  body{
    font-size:16px;
  }

  h1{
    font-size:24px;
  }

  h2{
    font-size:20px;
  }
}

@media (max-width:480px){
  h1{
    font-size:20px;
  }

  h2{
    font-size:18px;
  }
}
</style>
<title>Sell Company</title>
<link rel="stylesheet" href="/style.css">
<link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/components/leh-design-system.css">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/assets/css/learn-earnhub-ui.css">
</head>

<body><div id="global-header"></div>

<div class="card">

<h1>🏢 Sell Your Company</h1>

<p>
Submit business details for review.
</p>

<ul>
<li>Company information</li>
<li>Industry</li>
<li>Business value</li>
<li>Documents</li>
<li>Sale expectations</li>
</ul>

</div>

<div class="card">
<h2>Company Sale Request</h2>

<form action="/api/company-sale-request" method="POST">

<label>Company Name</label><br>
<input name="company_name" placeholder="Company name" required><br><br>

<label>Industry</label><br>
<input name="industry" placeholder="Industry" required><br><br>

<label>Company Value (PKR)</label><br>
<input name="company_value" placeholder="Estimated value"><br><br>

<label>Owner Name</label><br>
<input name="owner_name" placeholder="Owner name" required><br><br>

<label>Email</label><br>
<input name="email" type="email" placeholder="Email"><br><br>

<label>Phone</label><br>
<input name="phone" placeholder="Phone number"><br><br>

<label>Sale Details</label><br>
<textarea name="details" placeholder="Describe your company and sale expectations"></textarea><br><br>

<button type="submit">Submit Company For Review</button>

</form>
</div>

<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
<script src="/assets/js/theme-helper.js"></script>
</body>
</html>
