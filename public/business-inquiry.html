<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  line-height:1.6;
  overflow-x:hidden;
}

img{
  max-width:100%;
  height:auto;
}

table{
  display:block;
  overflow-x:auto;
  width:100%;
}

.card{
  width:100%;
  max-width:100%;
}

@media (max-width:768px){
  body{
    font-size:16px;
  }

  h1{
    font-size:24px;
  }

  h2{
    font-size:20px;
  }
}

@media (max-width:480px){
  h1{
    font-size:20px;
  }

  h2{
    font-size:18px;
  }
}
</style>
<title>Business Inquiry</title>
<link rel="stylesheet" href="/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script src="/business-inquiry.js"></script>

<link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/components/leh-design-system.css">
</head>

<body><div id="global-header"></div>

<div class="card">

<h1>📩 Send Business Inquiry</h1>

<input id="business_id" placeholder="Business ID">

<textarea id="message"
placeholder="Write your inquiry">
</textarea>

<button onclick="sendInquiry()">
Send Inquiry
</button>

<p id="result"></p>

</div>

<div id="global-footer"></div><script src="/global-layout.js"></script></body>
</html>
