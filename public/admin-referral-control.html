<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  line-height:1.6;
  overflow-x:hidden;
}

img{
  max-width:100%;
  height:auto;
}

table{
  display:block;
  overflow-x:auto;
  width:100%;
}

.card{
  width:100%;
  max-width:100%;
}

@media (max-width:768px){
  body{
    font-size:16px;
  }

  h1{
    font-size:24px;
  }

  h2{
    font-size:20px;
  }
}

@media (max-width:480px){
  h1{
    font-size:20px;
  }

  h2{
    font-size:18px;
  }
}
</style>
<title>Private Referral Control</title>
<link rel="manifest" href="/manifest.json"></head>

<body><div id="global-header"></div>


<h1>
Private Referral Management
</h1>


<div id="referrals">
Loading...
</div>


<script src="/private-referral-admin.js"></script>


<script>

async function load(){

let data =
await loadAdminReferrals();


document.getElementById("referrals")
.innerHTML =
data.map(
r=>`

<div>

<h3>${r.business_name}</h3>

<p>
Referral Owner:
${r.referrer_id}
</p>

<p>
Status:
${r.status}
</p>

</div>

`
).join("");

}


load();

</script>


<div class="card"><a href="/admin-control-center.html">🛡 Admin Control Center</a></div>
<div id="global-footer"></div><script src="/global-layout.js"></script></body>
</html>
