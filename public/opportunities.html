<!DOCTYPE html>

<html>

<head>

<title>Global Opportunities</title>

<style>

body{
font-family:Arial;
background:#f5f7fb;
padding:20px;
}

.card{

background:white;
padding:15px;
margin:10px;

border-radius:12px;

}

</style>

</head>


<body>


<h1>🌍 Global Opportunities</h1>


<div id="list">

Loading...

</div>



<script>


async function load(){


let r=
await fetch(
"/api/global-opportunities"
);


let jobs=
await r.json();



list.innerHTML=
jobs.map(j=>`

<div class="card">

<h3>${j.title}</h3>

<p>${j.company || ""}</p>

<p>
Skill:
${j.required_skill || ""}
</p>

<a href="${j.apply_url}" target="_blank">
Apply
</a>


</div>

`).join("");

}


load();


</script>


</body>

</html>
