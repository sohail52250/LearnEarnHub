<!DOCTYPE html>

<html>

<head>

<title>Global Opportunities</title>

<style>

body{
font-family:Arial;
background:#f5f7fb;
padding:20px;
}

.card{

background:white;
padding:15px;
margin:10px;

border-radius:12px;

}

</style>

</head>


<body>
<div class="leh-global-nav">
<a href="/index.html">🏠 Home</a>
<a href="/learn.html">📚 Learn</a>
<a href="/jobs.html">💼 Jobs</a>
<a href="/task-marketplace.html">💰 Tasks</a>
<a href="/marketplace.html">🏪 Marketplace</a>
<a href="/post-job.html">📝 Post Job</a>
<a href="/login.html">🔐 Login</a>
<a href="/developer/login.html">🛠 Developer</a>
</div>
<style>
.leh-global-nav{
display:flex;
flex-wrap:wrap;
gap:8px;
padding:12px;
background:#f5f5f5;
border-radius:10px;
margin:10px 0;
}
.leh-global-nav a{
padding:8px 12px;
border-radius:8px;
text-decoration:none;
background:white;
border:1px solid #ddd;
font-size:14px;
}
</style>



<h1>🌍 Global Opportunities</h1>


<div id="list">

Loading...

</div>



<script>


async function load(){


let r=
await fetch(
"/api/global-opportunities"
);


let jobs=
await r.json();



list.innerHTML=
jobs.map(j=>`

<div class="card">

<h3>${j.title}</h3>

<p>${j.company || ""}</p>

<p>
Skill:
${j.required_skill || ""}
</p>

<a href="${j.apply_url}" target="_blank">
Apply
</a>


</div>

`).join("");

}


load();


</script>


</body>

</html>
