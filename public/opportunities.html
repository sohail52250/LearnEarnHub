<!DOCTYPE html>
<html>
<head>
<title>LearnEarnHub Opportunities</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
.card{
border:1px solid #ddd;
padding:15px;
margin:10px;
border-radius:12px;
}
button{
padding:8px 15px;
border-radius:8px;
}
</style>
</head>

<body>

<h1>💼 Opportunities Hub</h1>

<p>Jobs, tasks and earning opportunities from LearnEarnHub sources.</p>

<div id="list">Loading opportunities...</div>

<script>

async function load(){

let box=document.getElementById("list");
let jobs=[];

try{
let external=await fetch("/api/external/jobs-feed");
let e=await external.json();

if(e.jobs){
jobs.push(...e.jobs.map(x=>({
title:x.title,
category:x.category,
reward:x.reward,
type:x.type,
source:x.source,
url:x.apply_url
})));
}

}catch(err){}


try{
let partner=await fetch("/api/partner/jobs");
let p=await partner.json();

if(p.jobs){
jobs.push(...p.jobs.map(x=>({
title:x.title,
category:"Partner Job",
reward:x.reward+" "+(x.currency||""),
type:"task",
source:x.company,
url:x.website
})));
}

}catch(err){}


if(!jobs.length){
box.innerHTML="<p>No opportunities available.</p>";
return;
}


box.innerHTML=jobs.map(j=>`

<div class="card">

<h3>${j.title}</h3>

<p>📌 Source: ${j.source}</p>

<p>Category: ${j.category}</p>

<p>Type: ${j.type}</p>

<p>Reward: ${j.reward}</p>

${j.url && j.url.startsWith("http")?
`<a href="${j.url}" target="_blank" rel="noopener">
<button>Apply Now</button>
</a>`:
"<button disabled>No application link available</button>"
}

</div>

`).join("");

}

load();

</script>

</body>
</html>
