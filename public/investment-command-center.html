<!DOCTYPE html>
<html>

<head>

<title>Investment Command Center</title>

<meta charset="UTF-8">

<style>

.card{
border:1px solid #ddd;
padding:20px;
margin:10px;
border-radius:12px;
}

</style>

<link rel="stylesheet" href="/components/leh-design-system.css">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#0f172a">
</head>


<body><div id="global-header"></div>


<h1>🚀 Investment Command Center</h1>


<div id="summary" class="card">
Loading...
</div>


<div id="pipeline" class="card">
</div>


<div id="alerts" class="card">
</div>



<script>

let investor_id =
localStorage.getItem("user_id");


fetch(
"/api/investment-command-center?investor_id="+investor_id
)

.then(r=>r.json())

.then(d=>{


summary.innerHTML=

`

<h2>Portfolio Summary</h2>

Investments:
${d.summary.investments}

<br>

Active Deals:
${d.summary.active_deals}

<br>

Compliance:
${JSON.stringify(d.summary.compliance_status)}

`;



pipeline.innerHTML=

`

<h2>Deal Pipeline</h2>

<pre>
${JSON.stringify(d.pipeline,null,2)}
</pre>

`;



alerts.innerHTML=

`

<h2>AI Intelligence Alerts</h2>

<pre>
${JSON.stringify(d.alerts,null,2)}
</pre>

`;

});


</script>


<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
</body>

</html>
