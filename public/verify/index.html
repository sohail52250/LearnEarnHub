<script>


async function verify(){


let r=
await fetch(
"/api/verify-certificate?code="+code.value
);


let d=
await r.json();



result.innerHTML=

d.error ?

"❌ Certificate not found"

:

`

<h3>✅ VERIFIED</h3>

Skill:
${d.skill_name}

<br>

Status:
${d.status}

<br>

Code:
${d.verification_code}

`;

}


</script>
