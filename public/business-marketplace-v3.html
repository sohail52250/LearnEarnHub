<script>


async function loadBusinesses(){


let url="/api/business-marketplace-v3?"

+

+
"&city="+city.value;



let r=await fetch(url);

let d=await r.json();



list.innerHTML=(d.businesses||[])

.map(b=>`

<div class="card">


<img class="logo"
src="${b.logo||''}">


<h2>
${b.company_name}
ðŸ†
</h2>


<p>
${b.category||''}
</p>

${b.description||''}
</p>


<p>
${b.city||''}
</p>


<a href="/public-business-profile.html?user_id=${b.user_id}">
View Profile
</a>


</div>

`)

.join("");

}


loadBusinesses();


</script>
