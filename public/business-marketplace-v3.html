<!DOCTYPE html>
<html>

<head>

<title>Business Marketplace</title>

<meta charset="UTF-8">

<style>

.card{

border:1px solid #ddd;
padding:15px;
margin:10px;
border-radius:12px;

}

.logo{

width:80px;
height:80px;

}

</style>

<link rel="stylesheet" href="/components/leh-design-system.css">
</head>


<body><div id="global-header"></div>


<h1>
Business Marketplace
</h1>


<input id="search"
placeholder="Search business">


<input id="category"
placeholder="Category">


<input id="city"
placeholder="City">


<button onclick="loadBusinesses()">
Search
</button>


<div id="list">
Loading...
</div>



<script>


async function loadBusinesses(){


let url="/api/business-marketplace-v3?"

+
"search="+search.value

+
"&category="+category.value

+
"&city="+city.value;



let r=await fetch(url);

let d=await r.json();



list.innerHTML=(d.businesses||[])

.map(b=>`

<div class="card">


<img class="logo"
src="${b.logo||''}">


<h2>
${b.company_name}
🏆
</h2>


<p>
${b.category||''}
</p>


<p>
${b.description||''}
</p>


<p>
${b.city||''}
</p>


<a href="/public-business-profile.html?user_id=${b.user_id}">
View Profile
</a>


</div>

`)

.join("");

}


loadBusinesses();


</script>


<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
</body>

</html>
