<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  line-height:1.6;
  overflow-x:hidden;
}

img{
  max-width:100%;
  height:auto;
}

table{
  display:block;
  overflow-x:auto;
  width:100%;
}

.card{
  width:100%;
  max-width:100%;
}

@media (max-width:768px){
  body{
    font-size:16px;
  }

  h1{
    font-size:24px;
  }

  h2{
    font-size:20px;
  }
}

@media (max-width:480px){
  h1{
    font-size:20px;
  }

  h2{
    font-size:18px;
  }
}
</style>
<title>My Skill Badges</title>
<link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/components/leh-design-system.css">
</head>

<body><div id="global-header"></div>


<h1>
My Skill Badges
</h1>


<div id="badges">
Loading...
</div>


<script>

async function loadBadges(){

const user =
JSON.parse(localStorage.getItem("user")||"null");


const badges =
await fetch(
`${SUPABASE_URL}/rest/v1/learner_badges?user_id=eq.${user.id}`,
{
headers:{
apikey:SUPABASE_KEY,
Authorization:`Bearer ${SUPABASE_KEY}`
}
}
)
.then(r=>r.json());


document.getElementById("badges").innerHTML =
badges.map(
b=>"🏅 "+b.badge_name
).join("<br>");

}


loadBadges();

</script>


<div id="global-footer"></div><script src="/global-layout.js"></script></body>
</html>
