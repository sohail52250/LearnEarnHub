<!DOCTYPE html>
<html>

<head>
<title>My Skill Badges</title>
</head>

<body>


<h1>
My Skill Badges
</h1>


<div id="badges">
Loading...
</div>


<script>

async function loadBadges(){

const user =
JSON.parse(localStorage.getItem("user")||"null");


const badges =
await fetch(
`${SUPABASE_URL}/rest/v1/learner_badges?user_id=eq.${user.id}`,
{
headers:{
apikey:SUPABASE_KEY,
Authorization:`Bearer ${SUPABASE_KEY}`
}
}
)
.then(r=>r.json());


document.getElementById("badges").innerHTML =
badges.map(
b=>"🏅 "+b.badge_name
).join("<br>");

}


loadBadges();

</script>


</body>
</html>
