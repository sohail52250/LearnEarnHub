<style>

body{

}

.card{

background:white;

padding:15px;

margin:10px;

border-radius:12px;

}

</style>

</head>


<body>
<div class="leh-global-nav">
<a href="/index.html">🏠 Home</a>

<style>
.leh-global-nav{
display:flex;
flex-wrap:wrap;
gap:8px;
padding:12px;
background:#f5f5f5;
border-radius:10px;
margin:10px 0;
}
.leh-global-nav a{
padding:8px 12px;
border-radius:8px;
text-decoration:none;
background:white;
border:1px solid #ddd;
font-size:14px;
}
</style>



<h1>🏆 Top Learners</h1>


<div id="list">
Loading...
</div>



<script>


async function load(){


let r=
await fetch("/api/ranking");


let users=
await r.json();



list.innerHTML=
users.map((u,i)=>`

<div class="card">

<h3>
#${i+1}
</h3>

Points:
${u.total_points}

<br>

Level:
🏅 ${u.level}

</div>

`).join("");

}


load();


</script>


</body>
