<!DOCTYPE html>
<html>

<head>
<meta name="description" content="LearnEarnHub - Learn skills, find opportunities, earn online, and grow your career.">
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:title" content="LearnEarnHub">
<meta property="og:description" content="Learn, Earn and Grow.">
<link rel="canonical" href="https://learn-earnhub.vercel.app/">

<title>Enterprise Investor Portal</title>

<meta charset="UTF-8">

<style>

.card{
border:1px solid #ddd;
padding:20px;
margin:10px;
border-radius:12px;
}

</style>

<link rel="stylesheet" href="/components/leh-design-system.css">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#0f172a">
<link rel="stylesheet" href="/assets/css/learn-earnhub-ui.css">
</head>


<body><div id="global-header"></div>


<h1>🏢 Enterprise Investor Portal</h1>


<div class="card">

<h2>
Team Members
</h2>

<pre id="members">
Loading...
</pre>

</div>


<div class="card">

<h2>
Private Deal Rooms
</h2>

<pre id="rooms">
Loading...
</pre>

</div>


<div class="card">

<h2>
Enterprise Reports
</h2>

<pre id="reports">
Loading...
</pre>

</div>



<script>


let organization_id =
new URLSearchParams(location.search)
.get("organization_id");


fetch(
"/api/enterprise-investor-portal?organization_id="+organization_id
)

.then(r=>r.json())

.then(d=>{


members.innerHTML=
JSON.stringify(d.members,null,2);


rooms.innerHTML=
JSON.stringify(d.deal_rooms,null,2);


reports.innerHTML=
JSON.stringify(d.reports,null,2);


});


</script>


<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
</body>

</html>
