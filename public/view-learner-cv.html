<body>
<div class="leh-global-nav">
<a href="/index.html">🏠 Home</a>
<a href="/learn.html">📚 Learn</a>

<style>
.leh-global-nav{
display:flex;
flex-wrap:wrap;
gap:8px;
padding:12px;
background:#f5f5f5;
border-radius:10px;
margin:10px 0;
}
.leh-global-nav a{
padding:8px 12px;
border-radius:8px;
text-decoration:none;
background:white;
border:1px solid #ddd;
font-size:14px;
}
</style>
<div id="global-header"></div>

<h1>Professional CV</h1>

<div id="cv">
Loading...
</div>


<script>

let user_id=localStorage.getItem("user_id");


fetch("/api/cv-profile?user_id="+user_id)

.then(r=>r.json())

.then(d=>{

let p=d.profile;


document.getElementById("cv").innerHTML=`

<h2>${p.full_name||""}</h2>

<h3>${p.headline||""}</h3>

<p>${p.bio||""}</p>

<h3>Education</h3>
<p>${p.education||""}</p>


<h3>Experience</h3>
<p>${p.experience||""}</p>


<h3>Skills</h3>
<p>${p.technical_skills||""}</p>

<p>${p.soft_skills||""}</p>


<h3>Projects</h3>
<p>${p.projects||""}</p>


<h3>Certificates</h3>
<p>${p.certifications||""}</p>


<h3>Languages</h3>
<p>${p.languages||""}</p>


<h3>Contact</h3>
${p.email||""}<br>
${p.phone||""}


`;

});

</script>

<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
<script src="/assets/js/theme-helper.js"></script>
</body>
</html>
