<!DOCTYPE html>
<html>

<head>

<title>Business Products Marketplace</title>

<link rel="stylesheet" href="/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>

</head>


<body>


<div class="card">

<h1>🛒 Business Marketplace</h1>

<div id="products">
Loading...
</div>

</div>



<script>

async function loadProducts(){

const client=supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);


const {data}=await client
.from("business_products")
.select("*")
.eq("status","published")
.order(
"created_at",
{ascending:false}
);



document.getElementById("products").innerHTML=

(data||[]).map(p=>`

<div class="card">


${p.image_url ?
`<img src="${p.image_url}" width="150">`
:
""}


<h2>
${p.product_name}
</h2>


<p>
Category:
${p.category}
</p>


<p>
${p.description}
</p>


<p>
💰 Price:
Rs ${p.price}
</p>


<p>
📦 Stock:
${p.stock}
</p>


<button onclick="contactSeller('${p.business_id}')">
Contact Seller
</button>


</div>

`).join("")
||
"No products available";


}


function contactSeller(id){

location.href="/business-inquiry.html?business="+id;

}


loadProducts();


</script>


</body>
</html>
