<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  line-height:1.6;
  overflow-x:hidden;
}

img{
  max-width:100%;
  height:auto;
}

table{
  display:block;
  overflow-x:auto;
  width:100%;
}

.card{
  width:100%;
  max-width:100%;
}

@media (max-width:768px){
  body{
    font-size:16px;
  }

  h1{
    font-size:24px;
  }

  h2{
    font-size:20px;
  }
}

@media (max-width:480px){
  h1{
    font-size:20px;
  }

  h2{
    font-size:18px;
  }
}
</style>

<title>Business Products Marketplace</title>

<link rel="stylesheet" href="/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>

<link rel="manifest" href="/manifest.json"></head>


<body>


<div class="card">

<h1>🛒 Business Marketplace</h1>

<div id="products">
Loading...
</div>

</div>



<script>

async function loadProducts(){

const client=supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);


const {data}=await client
.from("business_products")
.select("*")
.eq("status","published")
.order(
"created_at",
{ascending:false}
);



document.getElementById("products").innerHTML=

(data||[]).map(p=>`

<div class="card">


${p.image_url ?
`<img src="${p.image_url}" width="150">`
:
""}


<h2>
${p.product_name}
</h2>


<p>
Category:
${p.category}
</p>


<p>
${p.description}
</p>


<p>
💰 Price:
Rs ${p.price}
</p>


<p>
📦 Stock:
${p.stock}
</p>


<button onclick="contactSeller('${p.business_id}')">
Contact Seller
</button>


</div>

`).join("")
||
"No products available";


}


function contactSeller(id){

location.href="/business-inquiry.html?business="+id;

}


loadProducts();


</script>


</body>
</html>
