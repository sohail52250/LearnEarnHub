<!DOCTYPE html>
<html>

<head>

<title>Enterprise Global Marketplace</title>

<meta charset="UTF-8">

<style>

.card{
border:1px solid #ddd;
padding:20px;
margin:10px;
border-radius:12px;
}

</style>

<link rel="stylesheet" href="/components/leh-design-system.css">
</head>


<body>


<h1>🌍 Enterprise Global Marketplace</h1>


<div class="card">

<h2>Global Companies</h2>

<pre id="companies">
Loading...
</pre>

</div>


<div class="card">

<h2>Supplier Marketplace</h2>

<pre id="suppliers">
Loading...
</pre>

</div>


<div class="card">

<h2>Global Opportunities</h2>

<pre id="opportunities">
Loading...
</pre>

</div>



<script>

fetch("/api/enterprise-global-marketplace")

.then(r=>r.json())

.then(d=>{

companies.innerHTML=
JSON.stringify(d.companies,null,2);

suppliers.innerHTML=
JSON.stringify(d.suppliers,null,2);

opportunities.innerHTML=
JSON.stringify(d.opportunities,null,2);

});

</script>


<script src="/js/role-guard.js"></script>
</body>

</html>
