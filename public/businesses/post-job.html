<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="/assets/css/app.css">
<script src="/assets/js/leh-api-client.js"></script>

<body>

<header class="site-header">
<div class="container nav">

<a class="brand" href="/">

</a>

<nav class="nav-links">
<a href="/learning/">Learning</a>
<a href="/businesses/">Businesses</a>

<div class="nav-actions">

<a class="btn btn-primary" href="/auth/create-account.html">Create account</a>
</div>

<main class="page">
<div class="container">

<div class="page-header">
<span class="eyebrow">Employment opportunity</span>
<h1>Publish a job opportunity.</h1>
<p>Create a professional job listing for people looking for work.</p>
</div>

<div class="form-card">
<div class="form-group">
<label>Job title</label>
<input placeholder="Job title">
</div>
<div class="form-group">
<label>Job description</label>
<textarea rows="6" placeholder="Describe the role"></textarea>
</div>
<div class="form-group">
<label>Work type</label>
<select>
<option>Remote</option>
<option>On-site</option>
<option>Hybrid</option>
</select>
</div>
<button class="btn btn-primary">Publish job</button>
</div>

</div>
</main>

<footer class="footer">
<div class="container">
<p>© <span data-year></span> LearnEarnHub. Learn. Build. Earn. Grow.</p>
</div>
