<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="/assets/css/app.css">
<script src="/assets/js/leh-api-client.js"></script>
<link rel="stylesheet" href="/assets/css/leh-language-system.css">

</head>
<body>

<header class="site-header">
<div class="container nav">

<a class="brand" href="/">
<span class="brand-mark">L</span>

</a>

<nav class="nav-links">
<a href="/learning/">Learning</a>
<a href="/businesses/">Businesses</a>
<a href="/corporate/">Corporate</a>

</nav>

<div class="nav-actions">

<a class="btn btn-primary" href="/auth/create-account.html">Create account</a>
</div>

</div>
</header>

<main class="page">
<div class="container">

<div class="page-header">
<span class="eyebrow">Business opportunity</span>
<h1>Publish a task.</h1>
<p>Create a clear task opportunity for people with the right skills.</p>
</div>

<div class="form-card">
<div class="form-group">
<label>Task title</label>
<input placeholder="What needs to be done?">
</div>
<div class="form-group">
<label>Description</label>
<textarea rows="6" placeholder="Describe the task"></textarea>
</div>
<div class="form-group">
<label>Required skills</label>
<input placeholder="Example: design, writing, data entry">
</div>
<button class="btn btn-primary">Publish task</button>
</div>

</div>
</main>

<footer class="footer">
<div class="container">
<p>© <span data-year></span> LearnEarnHub. Learn. Build. Earn. Grow.</p>
</div>
</footer>
