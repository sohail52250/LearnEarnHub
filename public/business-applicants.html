<!DOCTYPE html>
<html>
<head>
<title>LearnEarnHub Business Applicants</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:Arial;padding:20px}
.card{border:1px solid #ddd;padding:15px;margin:10px;border-radius:10px}
button,input{padding:10px;width:100%;margin:5px 0}
</style>
</head>

<body>
<div class="leh-global-nav">
<a href="/index.html">🏠 Home</a>
<a href="/learn.html">📚 Learn</a>
<a href="/jobs.html">💼 Jobs</a>
<a href="/task-marketplace.html">💰 Tasks</a>
<a href="/marketplace.html">🏪 Marketplace</a>
<a href="/post-job.html">📝 Post Job</a>
<a href="/login.html">🔐 Login</a>
<a href="/developer/login.html">🛠 Developer</a>
</div>
<style>
.leh-global-nav{
display:flex;
flex-wrap:wrap;
gap:8px;
padding:12px;
background:#f5f5f5;
border-radius:10px;
margin:10px 0;
}
.leh-global-nav a{
padding:8px 12px;
border-radius:8px;
text-decoration:none;
background:white;
border:1px solid #ddd;
font-size:14px;
}
</style>


<h2>Applicants Dashboard</h2>

<input id="job" placeholder="Enter job title">

<button onclick="loadApplicants()">
View Applicants
</button>

<div id="list">
</div>


<script>

async function loadApplicants(){

let job=document.getElementById("job").value;

let r=await fetch(
"/api/partner/applicants?job_title="+encodeURIComponent(job)
);

let data=await r.json();

let box=document.getElementById("list");


if(!data.applicants || !data.applicants.length){

box.innerHTML="No applicants found";
return;

}


box.innerHTML=data.applicants.map(a=>`

<div class="card">

<h3>${a.job_title}</h3>

<p>Status: ${a.status}</p>

<p>User ID: ${a.user_id}</p>

<p>Applied: ${a.created_at || ""}</p>

</div>

`).join("");

}

</script>

</body>
</html>
