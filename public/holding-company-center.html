<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  line-height:1.6;
  overflow-x:hidden;
}

img{
  max-width:100%;
  height:auto;
}

table{
  display:block;
  overflow-x:auto;
  width:100%;
}

.card{
  width:100%;
  max-width:100%;
}

@media (max-width:768px){
  body{
    font-size:16px;
  }

  h1{
    font-size:24px;
  }

  h2{
    font-size:20px;
  }
}

@media (max-width:480px){
  h1{
    font-size:20px;
  }

  h2{
    font-size:18px;
  }
}
</style>

<title>Holding Company Center</title>

<link rel="stylesheet" href="/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script src="/holding-company-center.js"></script>

<link rel="manifest" href="/manifest.json"></head>

<body>

<div class="card">

<h1>🏢 Holding Company Center</h1>

<input id="company_name"
placeholder="Holding Company Name">

<textarea id="description"
placeholder="Description"></textarea>


<button onclick="createHoldingCompany()">
Create Holding Company
</button>


<p id="message"></p>

</div>


<div class="card">

<h2>Your Holding Companies</h2>

<div id="companies">
Loading...
</div>

</div>


</body>
</html>
