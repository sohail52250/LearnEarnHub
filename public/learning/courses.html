<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Courses  LearnEarnHub</title>

<link rel="stylesheet" href="/assets/css/app.css">

<script src="/assets/js/leh-api-client.js"></script>
<script src="/assets/js/leh-learning-api.js"></script>

<link rel="stylesheet" href="/assets/css/leh-language-system.css">
<script src="/assets/js/leh-language-system.js" defer></script>

<style>
.course-toolbar {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin: 0 0 28px;
}

.course-search {
    flex: 1 1 320px;
    min-height: 46px;
    padding: 0 14px;
    border: 1px solid var(--border);
    border-radius: 11px;
    background: #fff;
    color: var(--text);
    outline: none;
}

.course-search:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(36,87,214,.1);
}

.course-status {
    padding: 18px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--muted);
}

.course-status.error {
    color: #a12828;
    border-color: #efb4b4;
    background: #fff7f7;
}

.course-card {
    display: flex;
    flex-direction: column;
    height: 100%;
}

.course-card-body {
    flex: 1;
}

.course-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin: 14px 0;
}

.course-badge {
    display: inline-flex;
    align-items: center;
    padding: 5px 9px;
    border-radius: 999px;
    background: var(--surface-soft);
    color: var(--muted);
    font-size: .82rem;
    font-weight: 700;
}

.course-card .card-link {
    margin-top: auto;
}

.course-empty {
    grid-column: 1 / -1;
}
</style>
</head>

<body>

<header class="site-header">
<div class="container nav">

<a class="brand" href="/">
<span class="brand-mark">L</span>
<span>LearnEarnHub</span>
</a>

<nav class="nav-links">
<a href="/learning/">Learning</a>
<a href="/businesses/">Businesses</a>
<a href="/corporate/">Corporate</a>
<a href="/developers/">Developers</a>

    <a href="/study-plan.html" class="btn">ðŸ“š Study Plan</a>
</nav>

<div class="nav-actions">
<a class="btn btn-secondary" href="/auth/sign-in.html">Sign in</a>
<a class="btn btn-primary" href="/auth/create-account.html">Create account</a>
</div>

</div>
</header>

<main class="page">

<div class="container">

<div class="page-header">
<span class="eyebrow">Course catalogue</span>

<h1>Find your next course.</h1>

<p>
Discover practical learning paths designed for people who want
useful skills and measurable progress.
</p>
</div>

<div class="course-toolbar">

<input
    id="course-search"
    class="course-search"
    type="search"
    placeholder="Search courses..."
    autocomplete="off"
    aria-label="Search courses"
>

</div>

<div
    id="course-status"
    class="course-status"
    role="status"
    aria-live="polite"
>
Loading courses...
</div>

<div
    id="courses"
    class="grid-3"
    style="display:none;"
></div>

</div>

</main>

<footer class="footer">

<div class="container">

<p>
 <span data-year></span> LearnEarnHub.
Learn. Build. Earn. Grow.
</p>

</div>

</footer>

<script src="/assets/js/app.js"></script>

<script>
(function () {
    "use strict";

    var allCourses = [];

    var courseBox = document.getElementById("courses");
    var statusBox = document.getElementById("course-status");
    var searchBox = document.getElementById("course-search");

    function escapeHtml(value) {
        return String(value == null ? "" : value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function normaliseResponse(response) {
        if (Array.isArray(response)) {
            return response;
        }

        if (response && Array.isArray(response.courses)) {
            return response.courses;
        }

        if (response && Array.isArray(response.data)) {
            return response.data;
        }

        if (response && response.data && Array.isArray(response.data.courses)) {
            return response.data.courses;
        }

        return [];
    }

    function courseTitle(course) {
        return course.title ||
            course.name ||
            course.course_title ||
            "Skill Course";
    }

    function courseDescription(course) {
        return course.description ||
            course.summary ||
            course.content ||
            "Practical learning resources from LearnEarnHub.";
    }

    function renderCourses(courses) {

        if (!courses.length) {

            courseBox.innerHTML =
                '<div class="card course-empty">' +
                    '<h3>No courses found</h3>' +
                    '<p>There are currently no courses matching your search.</p>' +
                '</div>';

            courseBox.style.display = "grid";
            return;
        }

        courseBox.innerHTML = courses.map(function (course) {

            var id = course.id ||
                course.course_id ||
                course.slug ||
                "";

            var title = courseTitle(course);

            var description = courseDescription(course);

            var category =
                course.category ||
                course.type ||
                "General";

            var level =
                course.level ||
                course.difficulty ||
                "Beginner";

            var instructor =
                course.instructor ||
                course.instructor_name ||
                "LearnEarnHub Instructor";

            var status =
                course.status ||
                "published";

            var href =
                "/learning/course.html?id=" +
                encodeURIComponent(String(id));

            return (
                '<article class="card course-card">' +

                    '<div class="course-card-body">' +

                        '<div class="icon" aria-hidden="true">L</div>' +

                        '<h3>' +
                            escapeHtml(title) +
                        '</h3>' +

                        '<p>' +
                            escapeHtml(description) +
                        '</p>' +

                        '<div class="course-meta">' +

                            '<span class="course-badge">' +
                                escapeHtml(category) +
                            '</span>' +

                            '<span class="course-badge">' +
                                escapeHtml(level) +
                            '</span>' +

                            '<span class="course-badge">' +
                                escapeHtml(status) +
                            '</span>' +

                        '</div>' +

                        '<p>' +
                            '<strong>Instructor:</strong> ' +
                            escapeHtml(instructor) +
                        '</p>' +

                    '</div>' +

                    '<a class="card-link" href="' +
                        href +
                    '">' +
                        'Start learning ' +
                    '</a>' +

                '</article>'
            );

        }).join("");

        courseBox.style.display = "grid";
    }

    function filterCourses() {

        var query = String(
            searchBox.value || ""
        ).trim().toLowerCase();

        if (!query) {
            renderCourses(allCourses);
            return;
        }

        var filtered = allCourses.filter(function (course) {

            var haystack = [
                course.title,
                course.name,
                course.description,
                course.summary,
                course.category,
                course.level,
                course.instructor
            ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();

            return haystack.indexOf(query) !== -1;
        });

        renderCourses(filtered);
    }

    async function loadCourses() {

        try {

            if (
                !window.LEH_LEARNING_API ||
                typeof window.LEH_LEARNING_API.getCourses !== "function"
            ) {
                throw new Error(
                    "LearnEarnHub learning API is unavailable."
                );
            }

            statusBox.textContent = "Loading courses...";

            var response =
                await window.LEH_LEARNING_API.getCourses();

            allCourses = normaliseResponse(response);

            statusBox.style.display = "none";

            renderCourses(allCourses);

        } catch (error) {

            console.error(
                "LearnEarnHub course catalogue error:",
                error
            );

            statusBox.className =
                "course-status error";

            statusBox.textContent =
                "Unable to load courses right now. " +
                "Please try again later.";

            courseBox.style.display = "none";
        }
    }

    searchBox.addEventListener(
        "input",
        filterCourses
    );

    document.addEventListener(
        "DOMContentLoaded",
        loadCourses
    );

})();
</script>

</body>
</html>
