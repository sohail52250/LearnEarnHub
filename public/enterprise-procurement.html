<!DOCTYPE html>
<html>

<head>
<meta name="description" content="LearnEarnHub - Learn skills, find opportunities, earn online, and grow your career.">
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:title" content="LearnEarnHub">
<meta property="og:description" content="Learn, Earn and Grow.">
<link rel="canonical" href="https://learn-earnhub.vercel.app/">

<title>Enterprise Procurement Center</title>

<meta charset="UTF-8">

<style>

.card{
border:1px solid #ddd;
padding:20px;
margin:10px;
border-radius:12px;
}

</style>

<link rel="stylesheet" href="/components/leh-design-system.css">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#0f172a">
</head>


<body><div id="global-header"></div>


<h1>📑 Enterprise Contract & Procurement Center</h1>


<div class="card">

<h2>Approved Vendors</h2>

<pre id="vendors">
Loading...
</pre>

</div>


<div class="card">

<h2>Purchase Requests</h2>

<pre id="requests">
Loading...
</pre>

</div>


<div class="card">

<h2>Contracts</h2>

<pre id="contracts">
Loading...
</pre>

</div>



<script>

let organization_id =
new URLSearchParams(location.search)
.get("organization_id");


fetch(
"/api/enterprise-procurement?organization_id="+organization_id
)

.then(r=>r.json())

.then(d=>{


vendors.innerHTML=
JSON.stringify(d.vendors,null,2);


requests.innerHTML=
JSON.stringify(d.purchase_requests,null,2);


contracts.innerHTML=
JSON.stringify(d.contracts,null,2);


});

</script>


<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
</body>

</html>
