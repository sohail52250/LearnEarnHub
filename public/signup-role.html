<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  line-height:1.6;
  overflow-x:hidden;
}

img{
  max-width:100%;
  height:auto;
}

table{
  display:block;
  overflow-x:auto;
  width:100%;
}

.card{
  width:100%;
  max-width:100%;
}

@media (max-width:768px){
  body{
    font-size:16px;
  }

  h1{
    font-size:24px;
  }

  h2{
    font-size:20px;
  }
}

@media (max-width:480px){
  h1{
    font-size:20px;
  }

  h2{
    font-size:18px;
  }
}
</style>
<title>Create LearnEarnHub Account</title>
<link rel="stylesheet" href="/style.css">
<link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/components/leh-design-system.css">
</head>


<body><div id="global-header"></div>


<div class="card">

<h1>
Join Learn & Earn Hub
</h1>


<input id="email" placeholder="Email">


<br>


<input id="password" type="password" placeholder="Password">


<br>


<select id="role">

<option value="learner">
🎓 I want to learn and earn
</option>

<option value="business">
🏢 I have a business
</option>

<option value="sponsor">
⭐ I want to sponsor opportunities
</option>

<option value="referral">
🤝 I want to refer businesses
</option>

</select>


<br>


<button onclick="signup()">
Create Account
</button>


</div>


<script src="/auth-config.js"></script>
<script src="/signup-role.js"></script>


<div id="global-footer"></div><script src="/global-layout.js"></script></body>
</html>
