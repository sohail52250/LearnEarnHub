<!DOCTYPE html>
<html>

<head>
<title>Create LearnEarnHub Account</title>
<link rel="stylesheet" href="/style.css">
</head>


<body>


<div class="card">

<h1>
Join Learn & Earn Hub
</h1>


<input id="email" placeholder="Email">


<br>


<input id="password" type="password" placeholder="Password">


<br>


<select id="role">

<option value="learner">
🎓 I want to learn and earn
</option>

<option value="business">
🏢 I have a business
</option>

<option value="sponsor">
⭐ I want to sponsor opportunities
</option>

<option value="referral">
🤝 I want to refer businesses
</option>

</select>


<br>


<button onclick="signup()">
Create Account
</button>


</div>


<script src="/auth-config.js"></script>
<script src="/signup-role.js"></script>


</body>
</html>
