<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account - LearnEarnHub</title><link rel="stylesheet" href="/assets/css/app.css"><style>.leh-auth-card{max-width:480px;margin:50px auto;padding:32px;border-radius:16px;background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.08)}.leh-field{margin:16px 0}.leh-field label{display:block;margin-bottom:7px;font-weight:600}.leh-field input,.leh-field select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d0d7de;border-radius:8px}.leh-google-btn{width:100%;height:46px;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid #d0d7de;border-radius:8px;background:#fff;color:#202124;font-weight:600;cursor:pointer}.leh-divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:#6b7280;font-size:13px}.leh-divider:before,.leh-divider:after{content:";height:1px;background:#e5e7eb;flex:1}</style><link rel="stylesheet" href="/assets/css/leh-language-system.css">

</head><body><header class="site-header"><div class="container nav"><a class="brand" href="/"><span class="brand-mark">L</span><span>LearnEarnHub</span></a><nav class="nav-links"><a href="/learning/">Learning</a><a href="/businesses/">Businesses</a><a href="/corporate/">Corporate</a><a href="/developers/">Developers</a></nav><div class="nav-actions"><a class="btn btn-secondary" href="/auth/sign-in.html">Sign in</a><a class="btn btn-primary" href="/auth/create-account.html">Create account</a></div></div></header><main class="page"><div class="container"><div class="leh-auth-card"><h1>Create your account.</h1><p>Create one LearnEarnHub account for learning, business and professional experiences.</p><form id="createAccountForm"><div class="leh-field"><label for="fullName">Full name</label><input id="fullName" autocomplete="name" placeholder="Your name" required></div><div class="leh-field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></div><div class="leh-field"><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" placeholder="Create a password" required></div><div class="leh-field"><label for="purpose">Primary purpose</label><select id="purpose"><option>Learning</option><option>Business</option><option>Corporate</option><option>Developer</option></select></div><button class="btn btn-primary" type="submit" style="width:100%">Create account</button></form><div class="leh-divider"><span>OR</span></div><button type="button" id="googleSignInBtn" class="leh-google-btn" onclick="googleLogin()"><span>G</span><span>Continue with Google</span></button><p>Already have an account? <a href="/auth/sign-in.html">Sign in</a></p></div></div></main><footer class="footer"><div class="container"><p> 2026 LearnEarnHub. Learn. Build. Earn. Grow.</p></div></footer><script src="/assets/js/app.js"></script><script src="/js/supabase-config.js"></script><script src="/g
