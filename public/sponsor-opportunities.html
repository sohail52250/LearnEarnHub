<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  line-height:1.6;
  overflow-x:hidden;
}

img{
  max-width:100%;
  height:auto;
}

table{
  display:block;
  overflow-x:auto;
  width:100%;
}

.card{
  width:100%;
  max-width:100%;
}

@media (max-width:768px){
  body{
    font-size:16px;
  }

  h1{
    font-size:24px;
  }

  h2{
    font-size:20px;
  }
}

@media (max-width:480px){
  h1{
    font-size:20px;
  }

  h2{
    font-size:18px;
  }
}
</style>
<title>Premium Opportunities</title>
<link rel="stylesheet" href="/style.css">
</head>


<body>


<div class="card">

<h1>
⭐ Premium Opportunities
</h1>

<p>
Exclusive opportunities from verified partners.
</p>

</div>


<div class="card">

<div id="sponsorList">
Loading...
</div>

</div>



<script src="/sponsor-opportunity-engine.js"></script>

<script>

async function load(){

let items =
await loadSponsoredOpportunities();


document.getElementById("sponsorList")
.innerHTML =
items.length
?
items.map(
x=>`

<div class="card">

<h3>${x.title}</h3>

<p>${x.description}</p>

<p>
Required Skills:
${(x.required_skills||[]).join(", ")}
</p>

</div>

`
).join("")
:
"No sponsored opportunities available";

}


load();

</script>


</body>
</html>
