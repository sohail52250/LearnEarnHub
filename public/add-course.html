<html>
<head>
<title>Add Course</title>

<script src="/adsense.js"></script>

<meta name="google-site-verification" content="Y2BUy8sqyn60btWaxWaRoW82IIMb_-RnKLafC5xHoYI" />

<title>Add Course</title>

<meta name="description" content="Learn add course and improve your computer and digital skills with Learn & Earn Hub. Free beginner-friendly lessons.">
<meta name="keywords" content="computer skills, digital skills, online learning, beginner courses, Learn Earn Hub">

<meta property="og:title" content="Add Course">

<body>

<div class="card">

<h2>Add Learning Content</h2>


<input id="title_en"
placeholder="Course title English">


<input id="title_ur"
placeholder="Course title Urdu">


<textarea id="content_en"
placeholder="English content">
</textarea>


<textarea id="content_ur"
placeholder="Urdu content">
</textarea>


<button onclick="save()">
Save Course
</button>


</div>



<script>

async function save(){

let r=await fetch("/api/courses/create",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

title_en:title_en.value,
title_ur:title_ur.value,

content_en:content_en.value,
content_ur:content_ur.value

})

});


alert(await r.text());

}

</script>


<script src="/mobile-nav.js"></script>
</body>
</html>
