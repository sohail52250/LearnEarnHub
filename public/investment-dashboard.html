<!DOCTYPE html>
<html>

<head>

<title>Investment Dashboard</title>

<meta charset="UTF-8">

<style>

.card{
border:1px solid #ddd;
padding:20px;
margin:10px;
border-radius:12px;
}

</style>

</head>


<body>


<h1>
📈 Investor Portfolio Dashboard
</h1>


<div id="summary">
Loading...
</div>


<div id="list">
</div>



<script>


let investor_id=

localStorage.getItem("user_id");



fetch(
"/api/investment-dashboard?investor_id="+investor_id
)

.then(r=>r.json())

.then(d=>{


summary.innerHTML=`

<div class="card">

<h3>Total Investment</h3>

${d.portfolio.total_investment}

</div>


<div class="card">

<h3>Total Returns</h3>

${d.portfolio.total_returns}

</div>


<div class="card">

<h3>Active Investments</h3>

${d.portfolio.active_investments}

</div>

`;



list.innerHTML=

(d.investments||[])

.map(i=>`

<div class="card">

Business:
${i.business_id}

<br>

Amount:
${i.amount}

<br>

Status:
${i.status}

</div>

`)

.join("");

});


</script>


</body>

</html>
