<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="canonical" href="https://learn-earnhub.vercel.app/">

<title>Learner Dashboard v2</title>

<meta charset="UTF-8">

<style>

body{
font-family:Arial;
padding:20px;
}

.card{
border:1px solid #ddd;
padding:15px;
margin:10px;
border-radius:10px;
}

</style>

<script src="/auth-guard.js"></script><link rel="stylesheet" href="/assets/css/leh-design-system.css">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#0f172a">
<link rel="stylesheet" href="/assets/css/learn-earnhub-ui.css">
<script src="/language-config.js"></script>



<link rel="stylesheet" href="/assets/css/leh-final-ui.css">
</head>


<body>
<div class="leh-global-nav">
<a href="/index.html">🏠 Home</a>
<a href="/learn.html">📚 Learn</a>
<a href="/jobs.html">💼 Jobs</a>
<a href="/task-marketplace.html">💰 Tasks</a>
<a href="/marketplace.html">🏪 Marketplace</a>
<a href="/post-job.html">📝 Post Job</a>
<a href="/login.html">🔐 Login</a>
<a href="/developer/login.html">🛠 Developer</a>
</div>
<style>
.leh-global-nav{
display:flex;
flex-wrap:wrap;
gap:8px;
padding:12px;
background:#f5f5f5;
border-radius:10px;
margin:10px 0;
}
.leh-global-nav a{
padding:8px 12px;
border-radius:8px;
text-decoration:none;
background:white;
border:1px solid #ddd;
font-size:14px;
}
</style>
<div id="global-header"></div>


<h1>
Learner Dashboard
</h1>


<div id="dashboard">
Loading...
</div>


<script>


const user_id=localStorage.getItem("user_id");


fetch("/api/learner-dashboard-v2?user_id="+user_id)

.then(r=>r.json())

.then(d=>{


let u=d.user||{};
let p=d.profile||{};


document.getElementById("dashboard").innerHTML=`

<div class="card">

<h2>
${u.name||"Learner"}
</h2>

<p>
Points: ⭐ ${u.points||0}
</p>

<p>
Profile Complete:
${d.profile_completion}%
</p>

</div>



<div class="card">

<h3>CV Profile</h3>

<a href="/public-learner-cv.html?user_id=${user_id}">
View Public CV
</a>

</div>



<div class="card">

<h3>Learning Progress</h3>

<p>
Completed Lessons:
${d.completed_courses}
</p>

</div>



<div class="card">

<h3>Skills</h3>

<p>
${p.technical_skills||"Add your skills"}
</p>

</div>



<div class="card">

<h3>Badges</h3>

${
(d.badges||[])
.map(
b=>"🏅 "+b.badge_name
)
.join("<br>")
}


</div>


`;

});


</script>


<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
<script src="/assets/js/theme-helper.js"></script>

<div class="leh-bottom-nav">
<a href="/index.html">🏠<span>Home</span></a>
<a href="/learn.html">📚<span>Learn</span></a>
<a href="/jobs.html">💼<span>Jobs</span></a>
<a href="/task-marketplace.html">💰<span>Earn</span></a>
<a href="/learner-dashboard.html">👤<span>Dashboard</span></a>
</div>

<style>
.leh-bottom-nav{
display:none;
}

@media(max-width:700px){
.leh-bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
display:flex;
justify-content:space-around;
background:white;
border-top:1px solid #ddd;
padding:8px 4px;
z-index:9999;
}

.leh-bottom-nav a{
text-align:center;
text-decoration:none;
font-size:12px;
}

.leh-bottom-nav span{
display:block;
}
body{
padding-bottom:70px;
}
}
</style>
<button id="google-signin" class="btn btn-primary">Sign in with Google</button>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  document.getElementById('google-signin')?.addEventListener('click', function(){
    googleLogin();
  });
  supabase.auth.getSession().then(({ data: { session } }) => {
    if (session) {
      window.location.href = 'dashboard.html';
    }
  });
</script>
<script src="/auth-system.js"></script>
    <script src="/mobile-nav.js"></script>
</body>

</html>
