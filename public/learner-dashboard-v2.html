<!DOCTYPE html>
<html>

<head>

<title>Learner Dashboard v2</title>

<meta charset="UTF-8">

<style>

body{
font-family:Arial;
padding:20px;
}

.card{
border:1px solid #ddd;
padding:15px;
margin:10px;
border-radius:10px;
}

</style>

<script src="/auth-guard.js"></script><link rel="stylesheet" href="/components/leh-design-system.css">
<link rel="icon" type="image/png" href="/favicon.png">
</head>


<body><div id="global-header"></div>


<h1>
Learner Dashboard
</h1>


<div id="dashboard">
Loading...
</div>


<script>


const user_id=localStorage.getItem("user_id");


fetch("/api/learner-dashboard-v2?user_id="+user_id)

.then(r=>r.json())

.then(d=>{


let u=d.user||{};
let p=d.profile||{};


document.getElementById("dashboard").innerHTML=`

<div class="card">

<h2>
${u.name||"Learner"}
</h2>

<p>
Points: ⭐ ${u.points||0}
</p>

<p>
Profile Complete:
${d.profile_completion}%
</p>

</div>



<div class="card">

<h3>CV Profile</h3>

<a href="/public-learner-cv.html?user_id=${user_id}">
View Public CV
</a>

</div>



<div class="card">

<h3>Learning Progress</h3>

<p>
Completed Lessons:
${d.completed_courses}
</p>

</div>



<div class="card">

<h3>Skills</h3>

<p>
${p.technical_skills||"Add your skills"}
</p>

</div>



<div class="card">

<h3>Badges</h3>

${
(d.badges||[])
.map(
b=>"🏅 "+b.badge_name
)
.join("<br>")
}


</div>


`;

});


</script>


<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
</body>

</html>
