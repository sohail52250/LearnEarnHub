<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  line-height:1.6;
  overflow-x:hidden;
}

img{
  max-width:100%;
  height:auto;
}

table{
  display:block;
  overflow-x:auto;
  width:100%;
}

.card{
  width:100%;
  max-width:100%;
}

@media (max-width:768px){
  body{
    font-size:16px;
  }

  h1{
    font-size:24px;
  }

  h2{
    font-size:20px;
  }
}

@media (max-width:480px){
  h1{
    font-size:20px;
  }

  h2{
    font-size:18px;
  }
}
</style>

<title>Company Asset Register</title>

<link rel="stylesheet" href="/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script src="/company-asset-register.js"></script>

<link rel="manifest" href="/manifest.json"></head>


<body><div id="global-header"></div>


<div class="card">

<h1>🏢 Company Asset Register</h1>


<input id="company_id"
placeholder="Company ID">


<input id="asset_name"
placeholder="Asset Name">


<input id="asset_type"
placeholder="Asset Type">


<input id="value"
placeholder="Estimated Value PKR"
type="number">


<textarea id="details"
placeholder="Asset Details"></textarea>


<button onclick="addAsset()">
Add Asset
</button>


<p id="message"></p>

</div>



<div class="card">

<h2>Assets</h2>

<div id="assets">
Loading...
</div>

</div>


<div id="global-footer"></div><script src="/global-layout.js"></script></body>
</html>
