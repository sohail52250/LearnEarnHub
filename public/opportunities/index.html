<!DOCTYPE html>
<html>
<head>
<title>LearnEarnHub Opportunities</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:Arial;padding:20px}
.card{border:1px solid #ddd;padding:15px;margin:10px;border-radius:10px}
button{padding:10px}
</style>
<script src="/language-config.js"></script>
<link rel="stylesheet" href="/assets/css/learn-earnhub-ui.css">
</head>
<body>
<div id="global-header"></div>

<h1>Available Jobs & Tasks</h1>

<div id="jobs">Loading...</div>

<script>
fetch("/api/external/jobs-feed")
.then(r=>r.json())
.then(data=>{
let box=document.getElementById("jobs");

box.innerHTML=data.jobs.map(j=>`
<div class="card">
<h3>${j.title}</h3>
<p>Source: ${j.source}</p>
<p>Category: ${j.category}</p>
<p>Reward: ${j.reward}</p>
<p>Verification: âš ï¸ External Source</p>

${j.apply_url?
`<a href="${j.apply_url}" target="_blank">
<button type="button" onclick="googleLogin()">Sign in with Google</button>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  document.getElementById('google-signin')?.onclick = () => {
    googleLogin();
  };
  supabase.auth.getSession().then(({ data: { session } }) => {
    if (session) {
      window.location.href = 'dashboard.html';
    }
  });
</script>
<script src="/auth-system.js"></script>
<script src="/config.js"></script>

<script src="/logout.js"></script>
<script src="/global-layout.js"></script>
</body>
</html>
