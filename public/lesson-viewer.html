<!DOCTYPE html>
<html>
<head>
<meta name="description" content="LearnEarnHub - Learn skills, find opportunities, earn online, and grow your career.">
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:title" content="LearnEarnHub">
<meta property="og:description" content="Learn, Earn and Grow.">
<link rel="canonical" href="https://learn-earnhub.vercel.app/">
<title>LearnEarnHub Lesson</title>
<meta charset="UTF-8">
<link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/components/leh-design-system.css">
<link rel="icon" type="image/png" href="/favicon.png">
</head>

<body><div id="global-header"></div>

<h1>Lesson Viewer</h1>

<div id="lesson">
Loading lesson...
</div>


<script>

const params=new URLSearchParams(location.search);
const course=params.get("course_id");


fetch("/api/lessons?course_id="+course)
.then(r=>r.json())
.then(x=>{

let html="";

x.data.forEach(l=>{

html+=`
<h2>${l.title_en}</h2>
<h3>${l.title_ur}</h3>

<p>${l.content_en}</p>

<p>${l.content_ur}</p>

<hr>
`;

});

document.getElementById("lesson").innerHTML=html;

});

</script>

<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
</body>
</html>
