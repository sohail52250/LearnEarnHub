<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  line-height:1.6;
  overflow-x:hidden;
}

img{
  max-width:100%;
  height:auto;
}

table{
  display:block;
  overflow-x:auto;
  width:100%;
}

.card{
  width:100%;
  max-width:100%;
}

@media (max-width:768px){
  body{
    font-size:16px;
  }

  h1{
    font-size:24px;
  }

  h2{
    font-size:20px;
  }
}

@media (max-width:480px){
  h1{
    font-size:20px;
  }

  h2{
    font-size:18px;
  }
}
</style>
<title>Acquisition Request</title>
<link rel="stylesheet" href="/style.css">
<link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/components/leh-design-system.css">
<link rel="icon" type="image/png" href="/favicon.png">
</head>

<body><div id="global-header"></div>

<div class="card">

<h1>🤝 Acquisition Request</h1>

<p>
Submit an interest request to acquire a company.
</p>

</div>


<div class="card">
<h2>🏢 Company Acquisition Request</h2>

<form action="/api/acquisition-request" method="POST">

<label>Your Name</label><br>
<input name="name" placeholder="Your name" required><br><br>

<label>Email</label><br>
<input name="email" type="email" placeholder="Email"><br><br>

<label>Phone</label><br>
<input name="phone" placeholder="Phone number"><br><br>

<label>Company Interested In</label><br>
<input name="company_name" placeholder="Company name"><br><br>

<label>Industry</label><br>
<input name="industry" placeholder="Business industry"><br><br>

<label>Acquisition Budget (PKR)</label><br>
<input name="budget" placeholder="Available acquisition budget"><br><br>

<label>Message / Requirements</label><br>
<textarea name="requirements" placeholder="Describe acquisition interest"></textarea><br><br>

<button type="submit">Submit Acquisition Request</button>

</form>
</div>

<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
</body>
</html>
