<!DOCTYPE html>
<html>
<head>
<meta name="description" content="LearnEarnHub - Learn skills, find opportunities, earn online, and grow your career.">
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:title" content="LearnEarnHub">
<meta property="og:description" content="Learn, Earn and Grow.">
<link rel="canonical" href="https://learn-earnhub.vercel.app/">
<title>AI Deal Room Request</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/components/leh-design-system.css">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#0f172a">
<link rel="stylesheet" href="/assets/css/learn-earnhub-ui.css">
</head>

<body>

<div id="global-header"></div>

<div class="card">

<h1>🤖 AI Deal Room Access Request</h1>

<form id="dealRequest">

<input id="company" placeholder="Company Name" required><br><br>

<input id="email" placeholder="Email" required><br><br>

<textarea id="purpose" placeholder="Deal purpose"></textarea><br><br>

<button type="submit">
Request Access
</button>

</form>

<p id="msg"></p>

</div>

<div id="global-footer"></div>

<script src="/global-layout.js"></script>

<script>
document.getElementById("dealRequest").onsubmit=async(e)=>{
e.preventDefault();

let data={
company:company.value,
email:email.value,
purpose:purpose.value,
status:"pending"
};

let r=await fetch("/api/ai-deal-request",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(data)
});

msg.innerHTML=await r.text();

};
</script>

</body>
</html>
