<!DOCTYPE html>

<html>

<head>

<title>LearnEarnHub Login</title>

<style>

body{
font-family:Arial;
background:#f4f7fb;
padding:30px;
}

.box{
background:white;
max-width:400px;
margin:auto;
padding:20px;
border-radius:12px;
}

input,button{

width:100%;
padding:12px;
margin:8px 0;

}

button{

background:#1565c0;
color:white;
border:0;

}

</style>

</head>


<body>


<div class="box">

<h2>🔐 LearnEarnHub</h2>


<input id="email" placeholder="Email">


<input id="password" type="password" placeholder="Password">


<button onclick="login()">
Login
</button>


<button onclick="signup()">
Create Account
</button>


<p id="msg"></p>


</div>



<script>


async function send(action){


let res=await fetch("/api/auth",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

action,

email:email.value,

password:password.value

})

});


let data=await res.json();


msg.innerText=
data.error || "Success ✅";


}



function login(){

send("login");

}


function signup(){

send("signup");

}


</script>


<script src="/js/login-handler.js"></script></body>

</html>
