<script>



async function send(action) {
    const emailEl = document.getElementById("email");
    const passwordEl = document.getElementById("password");
    const msgEl = document.getElementById("msg");

    const email = emailEl ? emailEl.value.trim() : "";
    const password = passwordEl ? passwordEl.value : "";

    if (!email || !password) {
        if (msgEl) {
            msgEl.innerText = "Email and password are required.";
        }
        return;
    }

    try {
        if (msgEl) {
            msgEl.innerText = "Please wait...";
        }

        const response = await fetch("/api/auth", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                action,
                email,
                password
            })
        });

        const data = await response.json();

        if (!response.ok || data.error) {
            if (msgEl) {
                msgEl.innerText = data.error || "Authentication failed.";
            }
            return;
        }

        if (action === "login") {
            if (data.user) {
                localStorage.setItem(
                    "user",
                    JSON.stringify(data.user)
                );

                if (data.user.id) {
                    localStorage.setItem(
                        "user_id",
                        data.user.id
                    );
                }
            }

            if (data.session) {
                localStorage.setItem(
                    "access_token",
                    data.session.access_token || ""
                );

                localStorage.setItem(
                    "refresh_token",
                    data.session.refresh_token || ""
                );
            }

            if (msgEl) {
                msgEl.innerText = "Login successful. Redirecting...";
            }

            setTimeout(function() {
                window.location.href = "/dashboard-router.html";
            }, 500);

        } else {
            if (msgEl) {
                msgEl.innerText =
                    "Account created successfully. Please log in.";
            }

            setTimeout(function() {
                window.location.href = "/login.html";
            }, 800);
        }

    } catch (error) {
        console.error("AUTH ERROR:", error);

        if (msgEl) {
            msgEl.innerText =
                "Server error. Please try again.";
        }
    }
}

function login() {
    return send("login");
}

function signup() {
    return send("signup");
}

</script>
