<!DOCTYPE html>

<html>

<head>

<title>LearnEarnHub Login</title>

<style>

body{
font-family:Arial;
background:#f4f7fb;
padding:30px;
}

.box{
background:white;
max-width:400px;
margin:auto;
padding:20px;
border-radius:12px;
}

input,button{

width:100%;
padding:12px;
margin:8px 0;

}

button{

background:#1565c0;
color:white;
border:0;

}

</style>

</head>


<body>
<div class="leh-global-nav">
<a href="/index.html">🏠 Home</a>
<a href="/learn.html">📚 Learn</a>
<a href="/jobs.html">💼 Jobs</a>
<a href="/task-marketplace.html">💰 Tasks</a>
<a href="/marketplace.html">🏪 Marketplace</a>
<a href="/post-job.html">📝 Post Job</a>
<a href="/login.html">🔐 Login</a>
<a href="/developer/login.html">🛠 Developer</a>
</div>
<style>
.leh-global-nav{
display:flex;
flex-wrap:wrap;
gap:8px;
padding:12px;
background:#f5f5f5;
border-radius:10px;
margin:10px 0;
}
.leh-global-nav a{
padding:8px 12px;
border-radius:8px;
text-decoration:none;
background:white;
border:1px solid #ddd;
font-size:14px;
}
</style>



<div class="box">

<h2>🔐 LearnEarnHub</h2>


<input id="email" placeholder="Email">


<input id="password" type="password" placeholder="Password">


<button onclick="login()">
Login
</button>


<button onclick="signup()">
Create Account
</button>


<p id="msg"></p>


</div>



<script>


async function send(action){


let res=await fetch("/api/auth",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

action,

email:email.value,

password:password.value

})

});


let data=await res.json();


msg.innerText=
data.error || "Success ✅";


}



function login(){

send("login");

}


function signup(){

send("signup");

}


</script>


<script src="/js/login-handler.js"></script></body>

</html>
