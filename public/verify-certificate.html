<!DOCTYPE html>

<html>

<head>

<title>Verify Certificate - LearnEarnHub</title>

<style>

body{
font-family:Arial;
background:#f2f5f9;
padding:30px;
}

.box{
background:white;
padding:25px;
border-radius:12px;
max-width:500px;
margin:auto;
text-align:center;
}

input{
padding:12px;
width:90%;
}

button{
padding:12px 20px;
background:#1565c0;
color:white;
border:0;
border-radius:8px;
}

#result{
margin-top:20px;
}

</style>

</head>


<body>


<div class="box">

<h1>🔍 Verify LearnEarnHub Certificate</h1>


<input id="code"
placeholder="Enter Certificate Code">


<br><br>


<button onclick="verify()">
Verify
</button>


<div id="result"></div>


</div>



<script>


async function verify(){


const code=document
.getElementById("code")
.value;


const res=await fetch(
"/api/verify-certificate",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

certificate_code:code

})

});


const data=await res.json();


if(data.valid){

document.getElementById("result").innerHTML=
"✅ Valid Certificate<br>Code: "
+data.certificate.certificate_code;


}else{


document.getElementById("result").innerHTML=
"❌ Certificate Not Found";


}


}


</script>


</body>

</html>
