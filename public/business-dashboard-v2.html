<!DOCTYPE html>
<html>

<head>
<meta name="description" content="LearnEarnHub - Learn skills, find opportunities, earn online, and grow your career.">
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:title" content="LearnEarnHub">
<meta property="og:description" content="Learn, Earn and Grow.">
<link rel="canonical" href="https://learn-earnhub.vercel.app/">

<title>Business Dashboard</title>
<meta charset="UTF-8">

<style>

.card{
border:1px solid #ddd;
padding:15px;
margin:10px;
border-radius:10px;
}

</style>

<script src="/auth-guard.js"></script><link rel="stylesheet" href="/components/leh-design-system.css">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#0f172a">
<link rel="stylesheet" href="/assets/css/learn-earnhub-ui.css">
</head>


<body><div id="global-header"></div>


<h1>
Business Dashboard
</h1>


<div id="dashboard">
Loading...
</div>



<script>

let user_id=localStorage.getItem("user_id");


fetch("/api/business-dashboard-v2?user_id="+user_id)

.then(r=>r.json())

.then(d=>{


let b=d.business||{};


document.getElementById("dashboard").innerHTML=`

<div class="card">

<h2>
${b.company_name||"Business"}
</h2>

<p>
${b.description||""}
</p>

<p>
Verification:
${b.verified?"✅ Verified":"Pending"}
</p>

</div>


<div class="card">

<h3>
Opportunities Posted
</h3>

${d.opportunities.length}

</div>


<div class="card">

<h3>
Applications Received
</h3>

${d.applications.length}

</div>


<div class="card">

<h3>
Products / Services
</h3>

${d.products.length}

</div>


`;

});


</script>

<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
</body>

</html>
