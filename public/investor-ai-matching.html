<!DOCTYPE html>
<html>

<head>

<title>Investor AI Matching</title>

<meta charset="UTF-8">

<style>

.card{
border:1px solid #ddd;
padding:15px;
margin:10px;
border-radius:12px;
}

</style>

<link rel="stylesheet" href="/components/leh-design-system.css">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#0f172a">
</head>


<body><div id="global-header"></div>


<h1>
🤖 Investor AI Matching Engine
</h1>


<div id="matches">
Loading...
</div>


<script>


let funding_id=

new URLSearchParams(location.search)

.get("funding_id");



fetch(
"/api/investor-ai-matching?funding_id="+funding_id
)

.then(r=>r.json())

.then(d=>{


matches.innerHTML=

(d.matches||[])

.map(m=>`

<div class="card">

<h3>
Investor Match
</h3>

<p>
Match Score:
${m.match_score}%
</p>

<p>
${m.reason}
</p>

</div>

`)

.join("");

});


</script>


<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
</body>

</html>
