<!DOCTYPE html>
<html>
<head>
<title>Admin AI Deal Room</title>
<link rel="stylesheet" href="/components/leh-design-system.css">
</head>
<body>

<div class="card">
<h1>🤖 AI Deal Requests</h1>
<div id="requests">Loading...</div>
</div>

<script>
fetch("/api/admin/ai-deal-requests")
.then(r=>r.json())
.then(data=>{
document.getElementById("requests").innerHTML =
JSON.stringify(data,null,2);
});
</script>

</body>
</html>
