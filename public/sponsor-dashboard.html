<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  line-height:1.6;
  overflow-x:hidden;
}

img{
  max-width:100%;
  height:auto;
}

table{
  display:block;
  overflow-x:auto;
  width:100%;
}

.card{
  width:100%;
  max-width:100%;
}

@media (max-width:768px){
  body{
    font-size:16px;
  }

  h1{
    font-size:24px;
  }

  h2{
    font-size:20px;
  }
}

@media (max-width:480px){
  h1{
    font-size:20px;
  }

  h2{
    font-size:18px;
  }
}
</style>
<title>Sponsor Dashboard</title>
<link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/components/leh-design-system.css">
</head>


<body><div id="global-header"></div>


<div class="card">

<h1>
Business Sponsor Dashboard
</h1>


<input id="title"
placeholder="Opportunity title">


<br>


<textarea id="description"
placeholder="Describe opportunity">
</textarea>


<br>


<input id="skills"
placeholder="Required skills separated by comma">


<br>


<button onclick="submitOffer()">
Submit For Review
</button>


</div>


<script src="/sponsor-opportunity-engine.js"></script>


<script>

async function submitOffer(){

await submitSponsorOpportunity({

title:
document.getElementById("title").value,

description:
document.getElementById("description").value,

skills:
document.getElementById("skills").value
.split(",")

});


alert("Submitted for admin approval");

}

</script>


<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
</body>
</html>
