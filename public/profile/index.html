input,textarea,button{

<body>
<div id="global-header"></div>
<div class="leh-global-nav">

<style>
.leh-global-nav{
display:flex;
flex-wrap:wrap;
gap:8px;
padding:12px;
background:#f5f5f5;
border-radius:10px;
margin:10px 0;
}
.leh-global-nav a{
padding:8px 12px;

background:white;
border:1px solid #ddd;
font-size:14px;
}
</style>



<div class="card">


<h1>🎓 Learner Portfolio</h1>


<input id="user_id" placeholder="User ID">


<input id="full_name" placeholder="Full Name">


<textarea id="bio" placeholder="About your skills"></textarea>


<input id="portfolio_url" placeholder="Portfolio URL">


<button onclick="save()">

Save Profile

</button>


<p id="msg"></p>


</div>



<script>


async function save(){


let r=await fetch(
"/api/profile",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

action:"update",

data:{

user_id:user_id.value,

full_name:full_name.value,

bio:bio.value,

portfolio_url:portfolio_url.value

}

})

});


let d=await r.json();


msg.innerText=
d.error || "Profile saved ✅";


}


</script>

<button id="google-signin" style="padding:10px; font-size:16px;">Sign in with Google</button>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  document.getElementById('google-signin')?.addEventListener('click', function(){
    googleLogin();
  });

    if (session) {
      window.location.href = 'dashboard.html';
    }
  });
</script>
