<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  line-height:1.6;
  overflow-x:hidden;
}

img{
  max-width:100%;
  height:auto;
}

table{
  display:block;
  overflow-x:auto;
  width:100%;
}

.card{
  width:100%;
  max-width:100%;
}

@media (max-width:768px){
  body{
    font-size:16px;
  }

  h1{
    font-size:24px;
  }

  h2{
    font-size:20px;
  }
}

@media (max-width:480px){
  h1{
    font-size:20px;
  }

  h2{
    font-size:18px;
  }
}
</style>
<meta charset="UTF-8">
<title>Submit Advertisement</title>

<link rel="stylesheet" href="/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script src="/submit-advertisement.js"></script>

<link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/components/leh-design-system.css">
</head>
<body><div id="global-header"></div>

<h1>📣 Submit Advertisement</h1>

<input id="title" placeholder="Advertisement Title"><br><br>

<textarea id="description"
placeholder="Advertisement Details"></textarea><br><br>

<select id="package">
<option>Bronze</option>
<option>Silver</option>
<option>Gold</option>
</select>

<br><br>

<button onclick="submitAdvertisement()">
Submit Advertisement
</button>

<div id="msg"></div>

<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
</body>
</html>
