
<!DOCTYPE html>
<html>

<head>
<meta name="description" content="LearnEarnHub - Learn skills, find opportunities, earn online, and grow your career.">
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:title" content="LearnEarnHub">
<meta property="og:description" content="Learn, Earn and Grow.">
<link rel="canonical" href="https://learn-earnhub.vercel.app/">
<title>Learner CV Profile</title>
<meta charset="UTF-8">
<link rel="stylesheet" href="/components/leh-design-system.css">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#0f172a">
</head>


<body><div id="global-header"></div>

<h1>Professional Learner CV</h1>


<div id="cv">
Loading CV...
</div>


<script>

let user_id=localStorage.getItem("user_id");


fetch("/api/cv-profile?user_id="+user_id)
.then(r=>r.json())
.then(d=>{


let p=d.profile||{};


document.getElementById("cv").innerHTML=`

<h2>${p.full_name||""}</h2>

<h3>${p.headline||""}</h3>

<p>${p.bio||""}</p>

<hr>

<h3>Contact</h3>
${p.email||""}<br>
${p.phone||""}<br>
${p.city||""}, ${p.country||""}


<h3>Education</h3>
${p.education||""}


<h3>Experience</h3>
${p.experience||""}


<h3>Skills</h3>
${p.technical_skills||""}
<br>
${p.soft_skills||""}


<h3>Projects</h3>
${p.projects||""}


<h3>Certificates</h3>
${p.certifications||""}


<h3>Languages</h3>
${p.languages||""}


<h3>Career Goal</h3>
${p.career_goal||""}


`;

});

</script>


<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
</body>
</html>
