<body>
<div class="leh-global-nav">

<style>
.leh-global-nav{
display:flex;
flex-wrap:wrap;
gap:8px;
padding:12px;
background:#f5f5f5;
border-radius:10px;
margin:10px 0;
}
.leh-global-nav a{
padding:8px 12px;
border-radius:8px;
text-decoration:none;
background:white;
border:1px solid #ddd;
font-size:14px;
}
</style>



<h1>🏆 My Verified Skills</h1>


<div id="skills">
Loading...
</div>



<script>


const user_id=
new URLSearchParams(location.search)
.get("user_id");



async function load(){


let r=
await fetch(
"/api/skill-unlock?user_id="+user_id
);


let data=
await r.json();



skills.innerHTML=
data.map(s=>`

<div class="card">

<h3>
${s.skill_name}
</h3>

<p>
Status: VERIFIED ✅
</p>

</div>

`).join("");


}


load();


</script>


</body>

</html>
