<!DOCTYPE html>

<html>

<head>

<title>LearnEarnHub Global Jobs</title>

<meta name="viewport" content="width=device-width, initial-scale=1">


<style>

body{

font-family:Arial,sans-serif;

background:#f4f7fb;

padding:20px;

}


.header{

background:#1565c0;

color:white;

padding:20px;

border-radius:15px;

}


.search-box{

background:white;

padding:15px;

margin:15px 0;

border-radius:12px;

}


input,select,button{

width:100%;

padding:12px;

margin:6px 0;

border-radius:8px;

border:1px solid #ddd;

}


button{

background:#1565c0;

color:white;

border:none;

}


.job{

background:white;

padding:18px;

margin:12px 0;

border-radius:15px;

box-shadow:0 2px 8px #ddd;

}


.badge{

display:inline-block;

padding:5px 10px;

border-radius:20px;

background:#e3f2fd;

margin:3px;

}


.remote{

background:#e8f5e9;

}


.source{

background:#fff3e0;

}


.apply{

display:block;

background:#1565c0;

color:white;

text-align:center;

padding:10px;

border-radius:8px;

text-decoration:none;

margin-top:10px;

}


</style>

<script src="/language-config.js"></script>
</head>


<body>
<div class="leh-global-nav">
<a href="/index.html">🏠 Home</a>
<a href="/learn.html">📚 Learn</a>
<a href="/jobs.html">💼 Jobs</a>
<a href="/task-marketplace.html">💰 Tasks</a>
<a href="/marketplace.html">🏪 Marketplace</a>
<a href="/post-job.html">📝 Post Job</a>
<a href="/login.html">🔐 Login</a>
<a href="/developer/login.html">🛠 Developer</a>
</div>
<style>
.leh-global-nav{
display:flex;
flex-wrap:wrap;
gap:8px;
padding:12px;
background:#f5f5f5;
border-radius:10px;
margin:10px 0;
}
.leh-global-nav a{
padding:8px 12px;
border-radius:8px;
text-decoration:none;
background:white;
border:1px solid #ddd;
font-size:14px;
}
</style>



<div class="header">

<h1>🌍 LearnEarnHub Jobs</h1>

<p>Global jobs, tasks and freelance opportunities</p>

</div>



<div class="search-box">


<input id="keyword" placeholder="Search job">


<input id="skill" placeholder="Skill">


<select id="type">

<option value="">All Types</option>

<option>job</option>

<option>freelance</option>

<option>task</option>

<option>internship</option>

</select>



<select id="remote">

<option value="">Location</option>

<option value="true">
Remote
</option>

</select>



<button onclick="loadJobs()">

Search Opportunities

</button>


</div>



<div id="jobs">

Loading...

</div>



<script>


async function loadJobs(){


let params=new URLSearchParams({

keyword:keyword.value,

skill:skill.value,

type:type.value,

remote:remote.value

});



let response=
await fetch(
"/api/search-opportunities?"+params
);



let data=
await response.json();



jobs.innerHTML=
data.map(j=>`

<div class="job">


<h2>
${j.title}
</h2>


<p>
🏢 ${j.company || "Company"}
</p>


<span class="badge source">
${j.source_name || "LearnEarnHub"}
</span>


<span class="badge">
Skill: ${j.required_skills || j.required_skill || "Not specified"}
</span>


${j.remote ? 
'<span class="badge remote">🏠 Remote</span>'
:
''
}



<p>
💰 ${j.salary || "Salary not provided"}
</p>


<p>
🌍 ${j.country || "Global"}
</p>



<a class="apply"
href="${j.apply_url}"
target="_blank">

Apply Now

</a>


</div>

`).join("")
|| "No opportunities found";


}



loadJobs();


</script>



<div class="leh-bottom-nav">
<a href="/index.html">🏠<span>Home</span></a>
<a href="/learn.html">📚<span>Learn</span></a>
<a href="/jobs.html">💼<span>Jobs</span></a>
<a href="/task-marketplace.html">💰<span>Earn</span></a>
<a href="/learner-dashboard.html">👤<span>Dashboard</span></a>
</div>

<style>
.leh-bottom-nav{
display:none;
}

@media(max-width:700px){
.leh-bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
display:flex;
justify-content:space-around;
background:white;
border-top:1px solid #ddd;
padding:8px 4px;
z-index:9999;
}

.leh-bottom-nav a{
text-align:center;
text-decoration:none;
font-size:12px;
}

.leh-bottom-nav span{
display:block;
}
body{
padding-bottom:70px;
}
}
</style>
<button id="google-signin" style="padding:10px; font-size:16px;">Sign in with Google</button>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  document.getElementById('google-signin')?.addEventListener('click', function(){
    googleLogin();
  });
  supabase.auth.getSession().then(({ data: { session } }) => {
    if (session) {
      window.location.href = 'dashboard.html';
    }
  });
</script>
<script src="/auth-system.js"></script>
</body>

</html>
