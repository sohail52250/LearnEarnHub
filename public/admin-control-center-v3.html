<!DOCTYPE html>
<html>

<head>
<meta name="description" content="LearnEarnHub - Learn skills, find opportunities, earn online, and grow your career.">
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:title" content="LearnEarnHub">
<meta property="og:description" content="Learn, Earn and Grow.">
<link rel="canonical" href="https://learn-earnhub.vercel.app/">

<meta charset="UTF-8">

<title>
Admin Control Center V3
</title>

<style>

.card{
border:1px solid #ddd;
padding:20px;
margin:10px;
border-radius:10px;
}

</style>

<link rel="stylesheet" href="/components/leh-design-system.css">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#0f172a">
<link rel="stylesheet" href="/assets/css/learn-earnhub-ui.css">
</head>


<body><div id="global-header"></div>


<h1>
LearnEarnHub Admin Control Center V3
</h1>


<div id="dashboard">

Loading...

</div>


<script>


fetch("/api/admin-control-center")

.then(r=>r.json())

.then(d=>{


dashboard.innerHTML=`

<div class="card">
<h2>Users</h2>
${(d.users||[]).length}
</div>


<div class="card">
<h2>Enterprises</h2>
${(d.enterprises||[]).length}
</div>


<div class="card">
<h2>Pending Approvals</h2>
${(d.approvals||[]).length}
</div>

`;

});


</script>


<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
<script src="/assets/js/theme-helper.js"></script>
</body>

</html>
