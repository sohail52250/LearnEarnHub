<!DOCTYPE html>
<html>

<head>

<title>Investment Compliance Center</title>

<meta charset="UTF-8">

<style>

.card{
border:1px solid #ddd;
padding:20px;
margin:10px;
border-radius:12px;
}

</style>

</head>

<body><div id="global-header"></div>

<h1>🏛 Investment Compliance Center</h1>


<div class="card">

<h2>
Investor Verification
</h2>

<pre id="verification">
Loading...
</pre>

</div>


<div class="card">

<h2>
Compliance Documents
</h2>

<pre id="documents">
Loading...
</pre>

</div>


<script>

let investor_id =
localStorage.getItem("user_id");


fetch(
"/api/investment-compliance?investor_id="+investor_id
)

.then(r=>r.json())

.then(d=>{

verification.innerHTML=
JSON.stringify(d.verification,null,2);


documents.innerHTML=
JSON.stringify(d.documents,null,2);

});

</script>


<div id="global-footer"></div><script src="/global-layout.js"></script></body>

</html>
