<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  line-height:1.6;
  overflow-x:hidden;
}

img{
  max-width:100%;
  height:auto;
}

table{
  display:block;
  overflow-x:auto;
  width:100%;
}

.card{
  width:100%;
  max-width:100%;
}

@media (max-width:768px){
  body{
    font-size:16px;
  }

  h1{
    font-size:24px;
  }

  h2{
    font-size:20px;
  }
}

@media (max-width:480px){
  h1{
    font-size:20px;
  }

  h2{
    font-size:18px;
  }
}
</style>

<title>Business Deal Request</title>

<link rel="stylesheet" href="/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="/supabase-config.js"></script>

<link rel="manifest" href="/manifest.json"></head>


<body><div id="global-header"></div>

<div class="card">

<h1>🏢 Business Deal Request</h1>


<select id="type">

<option value="sale">
Sell Company
</option>

<option value="merger">
Merger
</option>

<option value="joint_venture">
Joint Venture
</option>

<option value="collaboration">
Collaboration
</option>

</select>


<input id="company"
placeholder="Company Name">


<input id="industry"
placeholder="Industry">


<textarea id="description"
placeholder="Describe your business">
</textarea>


<textarea id="requirements"
placeholder="What are you looking for?">
</textarea>


<input id="value"
placeholder="Expected Value">


<button onclick="submitBusinessDeal()">
Submit Request
</button>


<p id="result"></p>


</div>


<script src="/business-deal-request.js"></script>


<div id="global-footer"></div><script src="/global-layout.js"></script></body>

</html>
