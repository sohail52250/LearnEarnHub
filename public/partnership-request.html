<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  line-height:1.6;
  overflow-x:hidden;
}

img{
  max-width:100%;
  height:auto;
}

table{
  display:block;
  overflow-x:auto;
  width:100%;
}

.card{
  width:100%;
  max-width:100%;
}

@media (max-width:768px){
  body{
    font-size:16px;
  }

  h1{
    font-size:24px;
  }

  h2{
    font-size:20px;
  }
}

@media (max-width:480px){
  h1{
    font-size:20px;
  }

  h2{
    font-size:18px;
  }
}
</style>
<title>Partnership Request</title>
<link rel="stylesheet" href="/style.css">
<link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/components/leh-design-system.css">
<link rel="icon" type="image/png" href="/favicon.png">
</head>

<body><div id="global-header"></div>

<div class="card">

<h1>🤝 Partnership Request</h1>

<p>
Create collaboration opportunities between companies.
</p>

</div>

<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>

<div class="card">
<h2>🤝 Company Partnership Request</h2>

<form>
<input placeholder="Company Name" name="company_name" required><br><br>

<input placeholder="Contact Person" name="contact_person" required><br><br>

<input placeholder="Email" name="email" type="email"><br><br>

<input placeholder="Phone" name="phone"><br><br>

<textarea placeholder="Partnership details" name="details"></textarea><br><br>

<button type="submit">Submit Partnership Request</button>
</form>

</div>
</body>
</html>
