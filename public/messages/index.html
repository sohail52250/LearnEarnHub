<!DOCTYPE html>

<html>

<head>

<title>Messages</title>


<style>

body{

font-family:Arial;

background:#f5f7fb;

padding:20px;

}


.card{

background:white;

padding:15px;

margin:10px;

border-radius:12px;

}


input,textarea,button{

width:90%;

padding:10px;

margin:5px;

}


button{

background:#1565c0;

color:white;

border:0;

}

</style>


</head>


<body>


<h1>💬 Messages</h1>


<div class="card">


<input id="sender" placeholder="Sender ID">


<input id="receiver" placeholder="Receiver ID">


<textarea id="message" placeholder="Message"></textarea>


<button onclick="send()">

Send

</button>


</div>



<div id="inbox"></div>



<script>


async function send(){


await fetch(
"/api/messages",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

action:"send",

data:{

sender_id:sender.value,

receiver_id:receiver.value,

message:message.value

}

})

});


alert("Message sent ✅");


}


</script>


</body>

</html>
