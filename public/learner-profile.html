<!DOCTYPE html>
<html>
<head>
<meta name="description" content="LearnEarnHub - Learn skills, find opportunities, earn online, and grow your career.">
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:title" content="LearnEarnHub">
<meta property="og:description" content="Learn, Earn and Grow.">
<link rel="canonical" href="https://learn-earnhub.vercel.app/">
<title>Learner Profile</title>
<meta charset="UTF-8">
<link rel="stylesheet" href="/components/leh-design-system.css">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#0f172a">
</head>

<body><div id="global-header"></div>

<h1>Learner Profile / طالب پروفائل</h1>

<div id="profile">
Loading profile...
</div>


<script>

const user_id=localStorage.getItem("user_id");


fetch("/api/learner-profile?user_id="+user_id)
.then(r=>r.json())
.then(data=>{

document.getElementById("profile").innerHTML=`

<h2>${data.profile?.bio || "No Bio"}</h2>

<p>Skills:
${data.profile?.skills || "Not added"}
</p>

<p>
Level:
${data.profile?.level || 1}
</p>

<p>
Completed Lessons:
${data.completed_lessons}
</p>

<h3>Badges</h3>

${(data.badges||[])
.map(b=>"<p>🏅 "+b.badge_name+"</p>")
.join("")}

`;

});

</script>


<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
</body>
</html>
