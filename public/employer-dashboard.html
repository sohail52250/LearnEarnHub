<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  line-height:1.6;
  overflow-x:hidden;
}

img{
  max-width:100%;
  height:auto;
}

table{
  display:block;
  overflow-x:auto;
  width:100%;
}

.card{
  width:100%;
  max-width:100%;
}

@media (max-width:768px){
  body{
    font-size:16px;
  }

  h1{
    font-size:24px;
  }

  h2{
    font-size:20px;
  }
}

@media (max-width:480px){
  h1{
    font-size:20px;
  }

  h2{
    font-size:18px;
  }
}
</style>
<title>Employer Dashboard</title>
<link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/components/leh-design-system.css">
<link rel="icon" type="image/png" href="/favicon.png">
</head>

<body><div id="global-header"></div>


<div class="card">

<h1>
Employer Matching Dashboard
</h1>

<p>
Find skilled learners for your opportunity
</p>

</div>


<div class="card">

<h2>
Recommended Learners
</h2>

<div id="learners">
Loading...
</div>

</div>


<script src="/business-matching.js"></script>


<script>

async function loadMatches(){

let learners =
await findBusinessMatches([
"excel",
"typing",
"internet"
]);


document.getElementById("learners").innerHTML =
learners.length
?
learners.map(
l =>
`⭐ ${l.name || "Learner"} 
(${l.score}% match)`
).join("<br>")
:
"No matching learners found";

}


loadMatches();

</script>


<script src="/auth-role.js"></script>
<script src="/role-guard.js"></script>
<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
</body>
</html>
