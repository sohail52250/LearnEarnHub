<!DOCTYPE html>
<html>
<head>
<title>Employer Dashboard</title>
</head>

<body>


<div class="card">

<h1>
Employer Matching Dashboard
</h1>

<p>
Find skilled learners for your opportunity
</p>

</div>


<div class="card">

<h2>
Recommended Learners
</h2>

<div id="learners">
Loading...
</div>

</div>


<script src="/business-matching.js"></script>


<script>

async function loadMatches(){

let learners =
await findBusinessMatches([
"excel",
"typing",
"internet"
]);


document.getElementById("learners").innerHTML =
learners.length
?
learners.map(
l =>
`⭐ ${l.name || "Learner"} 
(${l.score}% match)`
).join("<br>")
:
"No matching learners found";

}


loadMatches();

</script>


<script src="/auth-role.js"></script>
<script src="/role-guard.js"></script>
</body>
</html>
