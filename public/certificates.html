<!DOCTYPE html>

<html>

<head>

<title>LearnEarnHub Certificates</title>

<style>

body{
font-family:Arial;
background:#f5f7fb;
padding:20px;
}

.card{
background:white;
padding:20px;
margin:15px;
border-radius:12px;
box-shadow:0 3px 10px #ccc;
}

</style>

</head>


<body>
<div class="leh-global-nav">
<a href="/index.html">🏠 Home</a>
<a href="/learn.html">📚 Learn</a>
<a href="/jobs.html">💼 Jobs</a>
<a href="/task-marketplace.html">💰 Tasks</a>
<a href="/marketplace.html">🏪 Marketplace</a>
<a href="/post-job.html">📝 Post Job</a>
<a href="/login.html">🔐 Login</a>
<a href="/developer/login.html">🛠 Developer</a>
</div>
<style>
.leh-global-nav{
display:flex;
flex-wrap:wrap;
gap:8px;
padding:12px;
background:#f5f5f5;
border-radius:10px;
margin:10px 0;
}
.leh-global-nav a{
padding:8px 12px;
border-radius:8px;
text-decoration:none;
background:white;
border:1px solid #ddd;
font-size:14px;
}
</style>



<h1>🏆 My Certificates</h1>


<div id="list">

Loading...

</div>



<script>


const user_id=
new URLSearchParams(location.search)
.get("user_id");



async function load(){


const res=await fetch(
"/api/certificate-download?user_id="+user_id
);


const data=await res.json();



list.innerHTML=
data.length?

data.map(c=>`

<div class="card">

<h2>
${c.courses?.title_en || "Course"}
</h2>

<p>
Certificate Code:
${c.certificate_code}
</p>

<p>
Issued:
${c.issued_at}
</p>

</div>

`).join("")

:

"No certificates yet";


}


load();


</script>


</body>

</html>
