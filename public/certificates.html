<h1>🏆 My Certificates</h1>


<div id="list">

Loading...

</div>



<script>


const user_id=
new URLSearchParams(location.search)
.get("user_id");



async function load(){


const res=await fetch(
"/api/certificate-download?user_id="+user_id
);


const data=await res.json();



list.innerHTML=
data.length?

data.map(c=>`

<div class="card">

<h2>
${c.courses?.title_en || "Course"}
</h2>

<p>
Certificate Code:
${c.certificate_code}
</p>

<p>
Issued:
${c.issued_at}
</p>

</div>

`).join("")

:

"No certificates yet";


}


load();


</script>
