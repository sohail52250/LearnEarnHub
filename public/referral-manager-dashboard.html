<!DOCTYPE html>
<html>

<head>
<meta name="description" content="LearnEarnHub - Learn skills, find opportunities, earn online, and grow your career.">
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:title" content="LearnEarnHub">
<meta property="og:description" content="Learn, Earn and Grow.">
<link rel="canonical" href="https://learn-earnhub.vercel.app/">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  line-height:1.6;
  overflow-x:hidden;
}

img{
  max-width:100%;
  height:auto;
}

table{
  display:block;
  overflow-x:auto;
  width:100%;
}

.card{
  width:100%;
  max-width:100%;
}

@media (max-width:768px){
  body{
    font-size:16px;
  }

  h1{
    font-size:24px;
  }

  h2{
    font-size:20px;
  }
}

@media (max-width:480px){
  h1{
    font-size:20px;
  }

  h2{
    font-size:18px;
  }
}
</style>
<title>Referral Manager</title>
<link rel="stylesheet" href="/style.css">
<link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/components/leh-design-system.css">
<link rel="icon" type="image/png" href="/favicon.png">
</head>


<body><div id="global-header"></div>


<div class="card">

<h1>
Referral Network Dashboard
</h1>

<p>
Manage business connections privately.
</p>

</div>



<div class="card">

<h2>
Referral Records
</h2>

<div id="referrals">
Loading...
</div>

</div>


<script>

async function loadReferralRecords(){

const data =
await fetch(
`${SUPABASE_URL}/rest/v1/business_referrals`,
{
headers:{
apikey:SUPABASE_KEY,
Authorization:`Bearer ${SUPABASE_KEY}`
}
}
)
.then(r=>r.json());


document.getElementById("referrals")
.innerHTML =
data.length
?
data.map(
r =>
`
<p>
Business: ${r.business_id}
<br>
Status: ${r.status}
</p>
`
).join("")
:
"No referrals yet";

}


loadReferralRecords();

</script>


<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
</body>
</html>
