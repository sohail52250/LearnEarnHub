<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  line-height:1.6;
  overflow-x:hidden;
}

img{
  max-width:100%;
  height:auto;
}

table{
  display:block;
  overflow-x:auto;
  width:100%;
}

.card{
  width:100%;
  max-width:100%;
}

@media (max-width:768px){
  body{
    font-size:16px;
  }

  h1{
    font-size:24px;
  }

  h2{
    font-size:20px;
  }
}

@media (max-width:480px){
  h1{
    font-size:20px;
  }

  h2{
    font-size:18px;
  }
}
</style>
<title>Referral Score</title>
<link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/components/leh-design-system.css">
</head>

<body><div id="global-header"></div>

<h1>My Referral Performance</h1>

<div id="score">
Loading...
</div>

<script src="/referral-score.js"></script>

<script>

async function load(){

const user =
JSON.parse(
localStorage.getItem("user") || "null"
);

if(!user){
document.getElementById("score").innerHTML =
"Login required";
return;
}

const data =
await getReferralScore(user.id);

if(!data.length){

document.getElementById("score").innerHTML =
"No score record yet";

return;
}

const s = data[0];

document.getElementById("score").innerHTML = `
<p>Total Referrals: ${s.total_referrals}</p>
<p>Approved Referrals: ${s.approved_referrals}</p>
<p>Active Businesses: ${s.active_businesses}</p>
<p>Referral Score: ${s.score}</p>
`;

}

load();

</script>

<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
</body>
</html>
