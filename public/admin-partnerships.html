<!DOCTYPE html>
<html>
<head>
<title>Partnership Admin - LearnEarnHub</title>
<link rel="stylesheet" href="/style.css">
</head>

<body>
<div class="leh-global-nav">
<a href="/index.html">🏠 Home</a>
<a href="/learn.html">📚 Learn</a>
<a href="/jobs.html">💼 Jobs</a>
<a href="/task-marketplace.html">💰 Tasks</a>

<a href="/login.html">🔐 Login</a>
<a href="/developer/login.html">🛠 Developer</a>
</div>
<style>
.leh-global-nav{
display:flex;
flex-wrap:wrap;
gap:8px;
padding:12px;
background:#f5f5f5;
border-radius:10px;
margin:10px 0;
}
.leh-global-nav a{
padding:8px 12px;
border-radius:8px;
text-decoration:none;
background:white;
border:1px solid #ddd;
font-size:14px;
}
</style>


<div id="global-header"></div>

<div class="card">
<h1>🤝 Partnership Requests</h1>

<div id="requests">
Loading requests...
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>

<script>

async function loadRequests(){

let {data,error}=await supabaseClient
.from("partnership_requests")
.select("*")
.order("created_at",{ascending:false});

if(error){
requests.innerHTML=error.message;
return;
}

requests.innerHTML=data.map(r=>`

<div class="card">

<h3>${r.name}</h3>
<p>${r.email}</p>
<p>${r.details}</p>
<p>Status: ${r.status}</p>

</div>

`).join("");

}

loadRequests();

</script>

<button onclick="logout()">Logout</button>
<script src="/admin-role-check.js"></script>
<script src="/admin-partnerships.js"></script>
</body>
</html>
