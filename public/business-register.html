<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register Business - Learn & Earn Hub</title>

<link rel="stylesheet" href="/style.css">

<script src="/supabase-config.js"></script>
<script src="/business-register.js"></script>

<link rel="manifest" href="/manifest.json"></head>


<body>

<div class="card">

<h1>
🏢 Register Business
</h1>

<p>
Create your company, firm or employer profile.
</p>


<input id="business-name"
placeholder="Company / Firm Name">


<input id="business-type"
placeholder="Business Type">


<input id="industry"
placeholder="Industry">


<textarea id="description"
placeholder="Business Description"></textarea>


<input id="website"
placeholder="Website">


<input id="contact"
placeholder="Contact">


<button onclick="saveBusiness()">
Create Business Profile
</button>


<p id="message"></p>


</div>


</body>

</html>
