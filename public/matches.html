<!DOCTYPE html>

<html>

<head>

<title>Matched Opportunities</title>

<style>

body{

font-family:Arial;

background:#f5f7fb;

padding:20px;

}

.card{

background:white;

padding:15px;

margin:10px;

border-radius:12px;

}

</style>

</head>


<body>
<div class="leh-global-nav">
<a href="/index.html">🏠 Home</a>
<a href="/learn.html">📚 Learn</a>
<a href="/jobs.html">💼 Jobs</a>
<a href="/task-marketplace.html">💰 Tasks</a>
<a href="/marketplace.html">🏪 Marketplace</a>
<a href="/post-job.html">📝 Post Job</a>
<a href="/login.html">🔐 Login</a>
<a href="/developer/login.html">🛠 Developer</a>
</div>
<style>
.leh-global-nav{
display:flex;
flex-wrap:wrap;
gap:8px;
padding:12px;
background:#f5f5f5;
border-radius:10px;
margin:10px 0;
}
.leh-global-nav a{
padding:8px 12px;
border-radius:8px;
text-decoration:none;
background:white;
border:1px solid #ddd;
font-size:14px;
}
</style>



<h1>🎯 Recommended Opportunities</h1>


<div id="list">

Loading...

</div>



<script>


const user_id=
new URLSearchParams(location.search)
.get("user_id");



async function load(){


await fetch(
"/api/skill-matches",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

action:"generate",

user_id

})

});


let r=
await fetch(
"/api/skill-matches?user_id="+user_id
);


let data=
await r.json();



list.innerHTML=
data.map(m=>`

<div class="card">

<h3>
${m.external_opportunities.title}
</h3>

<p>
Skill Match:
${m.match_score}%
</p>

<a href="${m.external_opportunities.apply_url}">
Apply
</a>

</div>

`).join("");

}


load();


</script>

</body>

</html>
