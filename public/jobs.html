<!DOCTYPE html>

<html>

<head>

<title>Skill Jobs</title>

<style>

body{
font-family:Arial;
background:#f5f7fb;
padding:20px;
}

.card{

background:white;
padding:15px;
margin:10px;
border-radius:12px;

}

button{

background:#1565c0;
color:white;
border:0;
padding:10px;

}

</style>

</head>


<body>


<h1>💼 Available Opportunities</h1>


<div id="jobs">
Loading...
</div>



<script>


const user_id=
new URLSearchParams(location.search)
.get("user_id");



async function load(){


let r=
await fetch(
"/api/marketplace-jobs?user_id="+user_id
);


let jobs=
await r.json();



document.getElementById("jobs")
.innerHTML=
jobs.map(j=>`

<div class="card">

<h3>${j.title}</h3>

<p>${j.description || ""}</p>

<p>
Skill:
${j.required_skill}
</p>


<button onclick="apply(${j.id})">
Apply
</button>


</div>

`).join("");

}



async function apply(id){

await fetch(
"/api/marketplace-jobs",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

action:"apply",

user_id,

opportunity_id:id

})

});


alert("Application sent ✅");

}



load();


</script>


</body>

</html>
