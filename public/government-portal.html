<!DOCTYPE html>
<html>
<head>
<meta name="description" content="LearnEarnHub - Learn skills, find opportunities, earn online, and grow your career.">
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:title" content="LearnEarnHub">
<meta property="og:description" content="Learn, Earn and Grow.">
<link rel="canonical" href="https://learn-earnhub.vercel.app/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Government Portal</title>
<link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/components/leh-design-system.css">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/assets/css/learn-earnhub-ui.css">
</head>
<body><div id="global-header"></div>
<h1>Government & Legal Authority Portal</h1>

<form id="govRequestForm">

<label>Department Name</label><br>
<input type="text" name="department" required><br><br>

<label>Officer Name</label><br>
<input type="text" name="officer_name" required><br><br>

<label>Officer ID</label><br>
<input type="text" name="officer_id" required><br><br>

<label>Official Email</label><br>
<input type="email" name="official_email" required><br><br>

<label>Country</label><br>
<input type="text" name="country" required><br><br>

<label>Request Type</label><br>
<select name="request_type">
<option>User Information</option>
<option>Business Information</option>
<option>Company Information</option>
<option>Fraud Investigation</option>
<option>Other</option>
</select><br><br>

<label>Case Reference</label><br>
<input type="text" name="case_reference"><br><br>

<label>Legal Basis</label><br>
<textarea name="legal_basis"></textarea><br><br>

<label>Upload Court Order</label><br>
<input type="file" name="court_order"><br><br>

<button type="submit">Submit Request</button>

</form>

<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
<script src="/assets/js/theme-helper.js"></script>
</body>
</html>
