
<!DOCTYPE html>

<html>

<head>

<title>
LearnEarnHub API Key Control
</title>

<style>

body{
font-family:Arial;
padding:30px;
}

button{
padding:8px;
margin:5px;
}

.card{
background:#eee;
padding:15px;
margin:10px;
border-radius:10px;
}

</style>

</head>


<body>
<div class="leh-global-nav">
<a href="/index.html">🏠 Home</a>
<a href="/learn.html">📚 Learn</a>
<a href="/jobs.html">💼 Jobs</a>
<a href="/task-marketplace.html">💰 Tasks</a>

</div>
<style>
.leh-global-nav{
display:flex;
flex-wrap:wrap;
gap:8px;
padding:12px;
background:#f5f5f5;
border-radius:10px;
margin:10px 0;
}
.leh-global-nav a{
padding:8px 12px;
border-radius:8px;
text-decoration:none;
background:white;
border:1px solid #ddd;
font-size:14px;
}
</style>



<h1>
API Key Control Center
</h1>


<div id="keys">
Loading...
</div>



<script>


async function load(){


let r=await fetch(
"/api/developer/key-control"
);


let d=await r.json();



document.getElementById("keys")
.innerHTML="";


d.keys.forEach(k=>{


document.getElementById("keys")
.innerHTML+=`

<div class="card">

<b>${k.key_name}</b>

<br>

${k.api_key}

<br>

Status:
${k.status}

<br>


<button onclick="changeKey(${k.id},'block')">
Block
</button>


<button onclick="changeKey(${k.id},'unblock')">
Unblock
</button>


</div>

`;

});


}



async function changeKey(id,action){


await fetch(
"/api/developer/key-control",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
id,
action
})

});


load();

}



load();


</script>


</body>

</html>
