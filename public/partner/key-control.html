
<!DOCTYPE html>

<html>

<head>

<title>
LearnEarnHub API Key Control
</title>

<style>

body{
font-family:Arial;
padding:30px;
}

button{
padding:8px;
margin:5px;
}

.card{
background:#eee;
padding:15px;
margin:10px;
border-radius:10px;
}

</style>

</head>


<body>


<h1>
API Key Control Center
</h1>


<div id="keys">
Loading...
</div>



<script>


async function load(){


let r=await fetch(
"/api/developer/key-control"
);


let d=await r.json();



document.getElementById("keys")
.innerHTML="";


d.keys.forEach(k=>{


document.getElementById("keys")
.innerHTML+=`

<div class="card">

<b>${k.key_name}</b>

<br>

${k.api_key}

<br>

Status:
${k.status}

<br>


<button onclick="changeKey(${k.id},'block')">
Block
</button>


<button onclick="changeKey(${k.id},'unblock')">
Unblock
</button>


</div>

`;

});


}



async function changeKey(id,action){


await fetch(
"/api/developer/key-control",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
id,
action
})

});


load();

}



load();


</script>


</body>

</html>
