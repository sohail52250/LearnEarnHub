
<!DOCTYPE html>

<html>

<head>

<title>
LearnEarnHub API Usage Dashboard
</title>

<style>

body{
font-family:Arial;
padding:30px;
background:#f4f4f4;
}

.card{
background:white;
padding:20px;
border-radius:12px;
}

</style>

</head>


<body>


<h1>
API Usage Analytics
</h1>


<div class="card">

<pre id="usage">
Loading...
</pre>

</div>



<script>

fetch("/api/developer/usage")

.then(r=>r.json())

.then(d=>{

document.getElementById("usage")
.textContent=
JSON.stringify(d,null,2);

});


</script>


</body>

</html>
