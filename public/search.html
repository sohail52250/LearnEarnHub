<h1>Search Learning Resources</h1>

<input id="searchBox" type="text" placeholder="Search lessons..." onkeyup="searchPages()">

<div id="results"></div>

<h2>اردو تلاش</h2>
<p>اپنی پسند کا سبق تلاش کریں۔</p>

<script>
const pages = [
["Microsoft Word Basics","/lessons/word-basics.html"],
["Microsoft Excel Basics","/lessons/excel-basics.html"],
["Microsoft PowerPoint Basics","/lessons/powerpoint-basics.html"],
["Windows Basics","/lessons/windows-basics.html"],
["Internet Browsing Basics","/lessons/internet-browsing.html"],
["Learning Guide","/learning-guide.html"],
["Computer Basics","/computer-basics.html"],
["Digital Skills","/digital-skills.html"]
];

function searchPages(){
 let q=document.getElementById("searchBox").value.toLowerCase();
 let html="";

 pages.forEach(function(p){
   if(p[0].toLowerCase().includes(q)){
     html += "<p><a href='"+p[1]+"'>"+p[0]+"</a></p>";
   }
 });

 document.getElementById("results").innerHTML=html;
}
</script>
