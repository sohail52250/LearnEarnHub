<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Post Business Offer</title>

<link rel="stylesheet" href="/style.css">

<script src="/supabase-config.js"></script>
<script src="/post-business-offer.js"></script>

</head>


<body>


<div class="card">

<h1>
📦 Post Business Opportunity
</h1>


<input id="business-name"
placeholder="Business/Firma Name">


<input id="category"
placeholder="Category">


<input id="offer"
placeholder="What do you sell?">


<input id="stock"
placeholder="Available stock quantity">


<input id="need"
placeholder="What do you need to buy?">


<input id="provide"
placeholder="What can you provide?">


<textarea id="details"
placeholder="Business details">
</textarea>



<button onclick="postBusinessOffer()">

Publish

</button>


<p id="message"></p>


</div>


</body>

</html>
