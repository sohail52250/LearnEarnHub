<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  line-height:1.6;
  overflow-x:hidden;
}

img{
  max-width:100%;
  height:auto;
}

table{
  display:block;
  overflow-x:auto;
  width:100%;
}

.card{
  width:100%;
  max-width:100%;
}

@media (max-width:768px){
  body{
    font-size:16px;
  }

  h1{
    font-size:24px;
  }

  h2{
    font-size:20px;
  }
}

@media (max-width:480px){
  h1{
    font-size:20px;
  }

  h2{
    font-size:18px;
  }
}
</style>
<title>Post Business Opportunity</title>
<link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/components/leh-design-system.css">
<link rel="icon" type="image/png" href="/favicon.png">
</head>

<body><div id="global-header"></div>


<div class="card">

<h1>
Post Business Opportunity
</h1>


<input id="product" placeholder="What do you sell?">

<br>

<input id="stock" placeholder="Stock available">

<br>

<input id="need" placeholder="Need buyers, resellers or distributors">

<br>

<input id="price" placeholder="Price / range">


<button onclick="postOffer()">
Submit
</button>


</div>



<script src="/business-marketplace-engine.js"></script>


<script>

async function postOffer(){

await createBusinessOffer({

product:
document.getElementById("product").value,

quantity:
document.getElementById("stock").value,

needs:
document.getElementById("need").value,

price:
document.getElementById("price").value

});


alert("Business opportunity submitted");

}


</script>


<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
</body>
</html>
