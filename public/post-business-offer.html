<!DOCTYPE html>
<html>

<head>
<title>Post Business Opportunity</title>
</head>

<body>


<div class="card">

<h1>
Post Business Opportunity
</h1>


<input id="product" placeholder="What do you sell?">

<br>

<input id="stock" placeholder="Stock available">

<br>

<input id="need" placeholder="Need buyers, resellers or distributors">

<br>

<input id="price" placeholder="Price / range">


<button onclick="postOffer()">
Submit
</button>


</div>



<script src="/business-marketplace-engine.js"></script>


<script>

async function postOffer(){

await createBusinessOffer({

product:
document.getElementById("product").value,

quantity:
document.getElementById("stock").value,

needs:
document.getElementById("need").value,

price:
document.getElementById("price").value

});


alert("Business opportunity submitted");

}


</script>


</body>
</html>
