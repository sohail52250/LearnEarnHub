<!DOCTYPE html>
<html>
<head>

<title>Learn & Earn Hub Certificate</title>

<link rel="stylesheet" href="/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>

<style>

.certificate{

max-width:800px;
margin:40px auto;
padding:40px;
border:8px solid #333;
text-align:center;
background:white;

}

.certificate h1{

font-size:42px;

}

.student{

font-size:28px;
font-weight:bold;

}

.date{

margin-top:20px;

}

button{

padding:12px 25px;
cursor:pointer;

}

</style>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script src="/certificate-generator.js"></script>

</head>



<body>


<div class="certificate">

<h1>🎓 Certificate of Completion</h1>


<p>This certificate is proudly awarded to</p>


<p class="student" id="student-name">

Student

</p>


<p>
For successfully completing
</p>


<h2 id="course-name">

Learn & Earn Hub Course

</h2>


<p class="date" id="certificate-date"></p>


<p>
Certificate ID:
<span id="certificate-id"></span>
</p>


</div>


<center>

<button onclick="window.print()">

Print Certificate

</button>

</center>



<script>

document.getElementById(
"certificate-date"
).innerHTML =
"Completed on: "+
new Date().toDateString();


document.getElementById(
"certificate-id"
).innerHTML =
"LEH-"+Date.now();


</script>



<div class="card">

<h2>Create Certificate</h2>

<input id="course-name"
placeholder="Course name">

<br><br>

<button onclick="
generateCertificate(
document.getElementById('course-name').value
)
">

Generate Certificate

</button>

<p id="certificate-result"></p>

</div>

</body>

</html>
