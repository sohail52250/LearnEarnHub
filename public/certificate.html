<div class="card">

<h1>🏆 LearnEarnHub Certificate</h1>

<h2 id="course"></h2>

<p id="code"></p>

<p id="date"></p>


<button class="btn btn-primary" onclick="window.print()">
Download / Print Certificate
</button>


</div>



<script>

async function loadCertificate(){


const params=new URLSearchParams(
location.search
);


const course=params.get("course_id");


const user=params.get("user_id");



const res=await fetch(
"/api/check-certificate",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

user_id:user,
course_id:course

})

});


const data=await res.json();



if(data.certificate){


document.getElementById("course").innerText=
"Course ID: "+data.certificate.course_id;


document.getElementById("code").innerText=
"Certificate Code: "+
data.certificate.certificate_code;


document.getElementById("date").innerText=
"Issued: "+
data.certificate.issued_at;


}else{


document.querySelector(".card").innerHTML=
"<h2>Certificate not available yet</h2>";

}


}


loadCertificate();


</script>
