body{

background:white;

padding:15px;

margin:10px;

border-radius:12px;

}


button{

padding:8px;

}

</style>

</head>


<body>
<div class="leh-global-nav">

<style>
.leh-global-nav{
display:flex;
flex-wrap:wrap;
gap:8px;
padding:12px;
background:#f5f5f5;
border-radius:10px;
margin:10px 0;
}
.leh-global-nav a{
padding:8px 12px;
border-radius:8px;
text-decoration:none;
background:white;
border:1px solid #ddd;
font-size:14px;
}
</style>



<h1>🔐 Verification Console</h1>


<div id="list">

Loading...

</div>



<script>


async function load(){


let r=
await fetch(
"/api/admin-verification"
);


let data=
await r.json();



list.innerHTML=
data.map(v=>`

<div class="card">

<h3>
${v.reference_code}
</h3>

<p>
Type:
${v.verification_type}
</p>

<p>
Class:
${v.classification}
</p>


<button onclick="update(${v.id},'active')">
Approve
</button>


<button onclick="update(${v.id},'rejected')">
Reject
</button>


</div>

`).join("");

}



async function update(id,status){


await fetch(
"/api/admin-verification",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

action:"update",

id,

status

})

});


load();


}


load();


</script>


</body>

</html>
