<!DOCTYPE html>

<html>

<head>

<title>Admin Verification</title>

<style>

body{

font-family:Arial;

background:#f5f7fb;

padding:20px;

}


.card{

background:white;

padding:15px;

margin:10px;

border-radius:12px;

}


button{

padding:8px;

margin:5px;

}

</style>

</head>


<body>


<h1>🔐 Verification Console</h1>


<div id="list">

Loading...

</div>



<script>


async function load(){


let r=
await fetch(
"/api/admin-verification"
);


let data=
await r.json();



list.innerHTML=
data.map(v=>`

<div class="card">

<h3>
${v.reference_code}
</h3>

<p>
Type:
${v.verification_type}
</p>

<p>
Class:
${v.classification}
</p>


<button onclick="update(${v.id},'active')">
Approve
</button>


<button onclick="update(${v.id},'rejected')">
Reject
</button>


</div>

`).join("");

}



async function update(id,status){


await fetch(
"/api/admin-verification",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

action:"update",

id,

status

})

});


load();


}


load();


</script>


</body>

</html>
