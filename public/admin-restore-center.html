<!DOCTYPE html>
<html>
<head>
<meta name="description" content="LearnEarnHub - Learn skills, find opportunities, earn online, and grow your career.">
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:title" content="LearnEarnHub">
<meta property="og:description" content="Learn, Earn and Grow.">
<link rel="canonical" href="https://learn-earnhub.vercel.app/">
<title>LearnEarnHub Restore Center</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:Arial;background:#f4f7fb;padding:20px}
.box{max-width:700px;margin:auto;background:white;padding:25px;border-radius:12px}
button{padding:12px 20px;background:#2563eb;color:white;border:0;border-radius:8px}
pre{background:#111;color:#0f0;padding:15px;border-radius:8px}
</style>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#0f172a">
<link rel="stylesheet" href="/assets/css/learn-earnhub-ui.css">
</head>
<body>

<div class="box">
<h2>🔐 LearnEarnHub Restore Center</h2>

<button onclick="backup()">Create Checkpoint</button>

<h3>Status</h3>
<pre id="out">Loading...</pre>

</div>

<script>

async function backup(){

let r=await fetch("/api/admin/create-backup",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
name:"Stable Production Checkpoint"
})
});

document.getElementById("out").innerText=
await r.text();

}

async function load(){

let r=await fetch("/api/admin/backups");

document.getElementById("out").innerText=
await r.text();

}

load();

</script>

<script src="/assets/js/theme-helper.js"></script>
</body>
</html>
