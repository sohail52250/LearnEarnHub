<!DOCTYPE html>
<html>

<head>

<title>LearnEarnHub Registration</title>

<link rel="stylesheet" href="/style.css">

<script src="/register-v2.js"></script>

</head>


<body>

<div class="card">

<h1>🚀 Create LearnEarnHub Account</h1>


<label>Name</label>
<input id="name">


<label>Email</label>
<input id="email">


<label>Select Account Type</label>

<select id="role">

<option value="learner">
📚 Learner
</option>

<option value="seller">
🏪 Seller
</option>

<option value="business">
🏢 Business Owner
</option>

<option value="investor">
💰 Investor
</option>

</select>


<button onclick="registerUser()">
Create Account
</button>


</div>

</body>

</html>
