<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  line-height:1.6;
  overflow-x:hidden;
}

img{
  max-width:100%;
  height:auto;
}

table{
  display:block;
  overflow-x:auto;
  width:100%;
}

.card{
  width:100%;
  max-width:100%;
}

@media (max-width:768px){
  body{
    font-size:16px;
  }

  h1{
    font-size:24px;
  }

  h2{
    font-size:20px;
  }
}

@media (max-width:480px){
  h1{
    font-size:20px;
  }

  h2{
    font-size:18px;
  }
}
</style>

<title>LearnEarnHub Registration</title>

<link rel="stylesheet" href="/style.css">

<script src="/register-v2.js"></script>

<link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/components/leh-design-system.css">
</head>


<body><div id="global-header"></div>

<div class="card">

<h1>🚀 Create LearnEarnHub Account</h1>


<label>Name</label>
<input id="name">


<label>Email</label>
<input id="email">


<label>Select Account Type</label>

<select id="role">

<option value="learner">
📚 Learner
</option>

<option value="seller">
🏪 Seller
</option>

<option value="business">
🏢 Business Owner
</option>

<option value="investor">
💰 Investor
</option>

</select>


<button onclick="registerUser()">
Create Account
</button>


</div>

<div id="global-footer"></div><script src="/global-layout.js"></script></body>

</html>
