<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  line-height:1.6;
  overflow-x:hidden;
}

img{
  max-width:100%;
  height:auto;
}

table{
  display:block;
  overflow-x:auto;
  width:100%;
}

.card{
  width:100%;
  max-width:100%;
}

@media (max-width:768px){
  body{
    font-size:16px;
  }

  h1{
    font-size:24px;
  }

  h2{
    font-size:20px;
  }
}

@media (max-width:480px){
  h1{
    font-size:20px;
  }

  h2{
    font-size:18px;
  }
}
</style>

<title>Sell Your Business</title>

<link rel="stylesheet" href="/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script src="/sell-business.js"></script>

</head>

<body>

<div class="card">

<h1>🏢 Sell Your Business</h1>

<input id="business_name" placeholder="Business / Company Name">

<input id="category" placeholder="Industry Category">

<textarea id="description"
placeholder="Business Description"></textarea>

<input id="years"
type="number"
placeholder="Years Operating">

<input id="price"
type="number"
placeholder="Asking Price PKR">

<textarea id="assets"
placeholder="Assets Included"></textarea>

<textarea id="reason"
placeholder="Reason For Selling"></textarea>


<button onclick="submitBusinessSale()">
Submit For Review
</button>


<p id="message"></p>

</div>

</body>
</html>
