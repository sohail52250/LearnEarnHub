<!DOCTYPE html>
<html>

<head>
<title>My Opportunities</title>
</head>


<body>


<h1>
Recommended Opportunities
</h1>


<div id="results">
Loading...
</div>



<script src="/opportunity-matching-engine.js"></script>


<script>


async function load(){

const user =
JSON.parse(
localStorage.getItem("user")||"null"
);



const results =
await findBestOpportunities(
user.id
);



document.getElementById("results")
.innerHTML =

results.length

?

results.map(
r=>`

<div class="card">

<h3>
${r.title}
</h3>

<p>
Match Score:
${r.match_score}%
</p>

<p>
${r.description || ""}
</p>

</div>

`
).join("")

:

"No matching opportunities";


}


load();


</script>


</body>
</html>
