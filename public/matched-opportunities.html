<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  line-height:1.6;
  overflow-x:hidden;
}

img{
  max-width:100%;
  height:auto;
}

table{
  display:block;
  overflow-x:auto;
  width:100%;
}

.card{
  width:100%;
  max-width:100%;
}

@media (max-width:768px){
  body{
    font-size:16px;
  }

  h1{
    font-size:24px;
  }

  h2{
    font-size:20px;
  }
}

@media (max-width:480px){
  h1{
    font-size:20px;
  }

  h2{
    font-size:18px;
  }
}
</style>
<title>My Opportunities</title>
<link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/components/leh-design-system.css">
</head>


<body><div id="global-header"></div>


<h1>
Recommended Opportunities
</h1>


<div id="results">
Loading...
</div>



<script src="/opportunity-matching-engine.js"></script>


<script>


async function load(){

const user =
JSON.parse(
localStorage.getItem("user")||"null"
);



const results =
await findBestOpportunities(
user.id
);



document.getElementById("results")
.innerHTML =

results.length

?

results.map(
r=>`

<div class="card">

<h3>
${r.title}
</h3>

<p>
Match Score:
${r.match_score}%
</p>

<p>
${r.description || ""}
</p>

</div>

`
).join("")

:

"No matching opportunities";


}


load();


</script>


<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
</body>
</html>
