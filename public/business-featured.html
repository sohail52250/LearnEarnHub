<!DOCTYPE html>
<html>

<head>

<title>Featured Businesses</title>

<link rel="stylesheet" href="/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>

</head>


<body>

<div class="card">

<h1>⭐ Featured Businesses</h1>

<div id="businesses">
Loading...
</div>


</div>


<script>

async function load(){

const client=supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);


const {data}=await client
.from("business_profiles")
.select("*")
.eq("premium",true);


document.getElementById("businesses").innerHTML=

(data||[]).map(b=>`

<div class="card">

<h2>
🏢 ${b.company_name} ⭐
</h2>

<p>
${b.description || ""}
</p>

</div>

`).join("");

}


load();

</script>

</body>
</html>
