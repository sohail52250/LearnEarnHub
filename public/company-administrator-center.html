<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  line-height:1.6;
  overflow-x:hidden;
}

img{
  max-width:100%;
  height:auto;
}

table{
  display:block;
  overflow-x:auto;
  width:100%;
}

.card{
  width:100%;
  max-width:100%;
}

@media (max-width:768px){
  body{
    font-size:16px;
  }

  h1{
    font-size:24px;
  }

  h2{
    font-size:20px;
  }
}

@media (max-width:480px){
  h1{
    font-size:20px;
  }

  h2{
    font-size:18px;
  }
}
</style>

<title>Company Administrator Center</title>

<link rel="stylesheet" href="/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>

<link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/components/leh-design-system.css">
</head>


<body><div id="global-header"></div>


<div class="card">

<h1>👤 Company Administrator Management</h1>


<input id="company_id"
placeholder="Company ID">


<input id="user_id"
placeholder="Administrator User ID">


<select id="role">

<option>
administrator
</option>

<option>
manager
</option>

<option>
auditor
</option>

</select>



<button onclick="assignAdmin()">
Assign Role
</button>


<p id="result"></p>


</div>



<script>

async function assignAdmin(){


const client=supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);



const {error}=await client
.from("company_administrators")
.insert({

company_id:
document.getElementById("company_id").value,

user_id:
document.getElementById("user_id").value,

role:
document.getElementById("role").value,

permissions:{},

status:"active"

});



document.getElementById("result")
.innerHTML=

error ? error.message :
"✅ Administrator assigned";


}


</script>


<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
</body>
</html>
