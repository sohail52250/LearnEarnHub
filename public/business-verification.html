
<!DOCTYPE html>
<html>

<head>
<meta name="description" content="LearnEarnHub - Learn skills, find opportunities, earn online, and grow your career.">

<title>Business Verification</title>

<meta charset="UTF-8">

<link rel="stylesheet" href="/components/leh-design-system.css">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/manifest.json">

</head>


<body><div id="global-header"></div>


<h1>
Business Verification Request
</h1>


<form id="verifyForm">


<input id="company_name"
placeholder="Company Name">


<input id="registration_number"
placeholder="Registration Number">


<input id="document_url"
placeholder="Document URL">


<button>
Submit Verification
</button>


</form>



<script>


verifyForm.onsubmit=async(e)=>{

e.preventDefault();


let body={

user_id:localStorage.getItem("user_id"),

company_name:company_name.value,

registration_number:registration_number.value,

document_url:document_url.value

};


let r=await fetch("/api/business-verification",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(body)

});


alert("Verification submitted");


};


</script>


<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
</body>

</html>
