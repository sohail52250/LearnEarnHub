<div class="card">


<h1>🏢 Post Job / Task</h1>


<input id="employer_id" placeholder="Employer ID">


<input id="title" placeholder="Job Title">


<input id="company" placeholder="Company">


<textarea id="description" placeholder="Description"></textarea>


<input id="skills" placeholder="Required Skills">


<select id="type">

<option>job</option>

<option>task</option>

<option>freelance</option>

<option>internship</option>

</select>


<button class="btn btn-primary" onclick="postJob()">

Submit

</button>


<p id="msg"></p>


</div>



<script>


async function postJob(){


let r=
await fetch(
"/api/employer-posts",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

action:"create",

data:{

employer_id:employer_id.value,

title:title.value,

company:company.value,

description:description.value,

required_skills:skills.value,

job_type:type.value

}

})

});


let d=
await r.json();


msg.innerText=
d.error || "Submitted for approval ✅";


}


</script>
