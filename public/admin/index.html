<!DOCTYPE html>

<html>

<head>

<title>LearnEarnHub Admin Panel</title>

<style>

body{

font-family:Arial;

background:#f5f7fb;

padding:20px;

}


.card{

display:inline-block;

background:white;

padding:20px;

margin:10px;

border-radius:12px;

min-width:180px;

}


a{

display:block;

margin:10px;

}

</style>

</head>


<body>


<h1>⚙️ LearnEarnHub Admin Panel</h1>


<div id="stats">

Loading...

</div>



<h2>Management</h2>


<a href="/admin/users.html">
👥 Users
</a>

</a>



<script>


async function load(){


let r=
await fetch(
"/api/admin-dashboard"
);


let d=
await r.json();



stats.innerHTML=

Object.entries(d)
.map(x=>`

<div class="card">

<b>${x[0]}</b>

<br>

${x[1]}

</div>

`).join("");

}


load();


</script>


</body>
