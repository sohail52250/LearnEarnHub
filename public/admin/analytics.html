<html>

<style>

}


.card{

background:white;

padding:20px;

margin:10px;

border-radius:12px;

display:inline-block;

min-width:180px;

box-shadow:0 2px 8px #ccc;

}


</style>


</head>


<body>
<div class="leh-global-nav">
<a href="/index.html">🏠 Home</a>
<a href="/learn.html">📚 Learn</a>
<a href="/jobs.html">💼 Jobs</a>
<a href="/task-marketplace.html">💰 Tasks</a>

<style>
.leh-global-nav{
display:flex;
flex-wrap:wrap;
gap:8px;
padding:12px;
background:#f5f5f5;
border-radius:10px;
margin:10px 0;
}
.leh-global-nav a{
padding:8px 12px;
border-radius:8px;
text-decoration:none;
background:white;
border:1px solid #ddd;
font-size:14px;
}
</style>



<h1>📊 LearnEarnHub Analytics</h1>



<div id="stats">

Loading...

</div>



<h2>Course Categories</h2>

<div id="categories"></div>



<script>


async function load(){


let s=
await fetch(
"/api/analytics?action=stats"
);


let stats=
await s.json();



document.getElementById("stats")
.innerHTML=`

<div class="card">
Users<br>
<b>${stats.total_users}</b>
</div>

<div class="card">
Courses<br>
<b>${stats.total_courses}</b>
</div>

<div class="card">
Lessons<br>
<b>${stats.total_lessons}</b>
</div>

<div class="card">
Completed Lessons<br>
<b>${stats.completed_lessons}</b>
</div>

<div class="card">
Certificates<br>
<b>${stats.certificates}</b>
</div>

`;



let c=
await fetch(
"/api/analytics?action=categories"
);


let categories=
await c.json();



document.getElementById("categories")
.innerHTML=
Object.entries(categories)
.map(x=>`

<div class="card">
${x[0]}<br>
<b>${x[1]}</b>
</div>

`).join("");

}


load();


</script>


</body>

</html>
