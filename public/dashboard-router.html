<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LearnEarnHub Account</title>

<script src="/js/supabase-config.js"></script>
<style>
body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}
.wrap{max-width:900px;margin:70px auto;padding:20px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:36px;box-shadow:0 12px 40px rgba(15,23,42,.08)}
h1{margin:0 0 8px;font-size:32px}
p{color:#667085}
.status{text-align:center;padding:20px}
</style>
<link rel="stylesheet" href="/assets/css/leh-language-system.css">
<script src="/assets/js/leh-language-system.js" defer></script>
</head>
<body>
<div class="wrap">
<div class="card">
<div class="status">
<h1>Checking your LearnEarnHub account</h1>
<p>Please wait while we securely complete sign-in.</p>
</div>
</div>
</div>
<script>
(async function(){
try{
const client=window.supabaseClient;
if(!client) throw new Error("Supabase client failed to initialize.");

const {data,error}=await client.auth.getSession();
if(error) throw error;

if(data.session){
location.replace("/profile.html?welcome=1");
}else{
location.replace("/auth/sign-in.html");
}
}catch(e){
console.error(e);
location.replace("/auth/sign-in.html?error=session");
}
})();
</script>
</body>
</html>
