<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  line-height:1.6;
  overflow-x:hidden;
}

img{
  max-width:100%;
  height:auto;
}

table{
  display:block;
  overflow-x:auto;
  width:100%;
}

.card{
  width:100%;
  max-width:100%;
}

@media (max-width:768px){
  body{
    font-size:16px;
  }

  h1{
    font-size:24px;
  }

  h2{
    font-size:20px;
  }
}

@media (max-width:480px){
  h1{
    font-size:20px;
  }

  h2{
    font-size:18px;
  }
}
</style>

<title>Dashboard Router</title>

<link rel="stylesheet" href="/style.css">

<script src="/role-access-control.js"></script>

</head>


<body>

<div class="card">

<h1>🔐 Dashboard Access</h1>

<p>
Checking account permissions...
</p>

</div>


<script>

const user=getCurrentUser();

if(user){

redirectByRole(user.role);

}

</script>


</body>

</html>
