<!DOCTYPE html>
<html>
<head>
<title>Notifications</title>
<link rel="stylesheet" href="/components/leh-design-system.css">
<link rel="icon" type="image/png" href="/favicon.png">
</head>
<body><div id="global-header"></div>
<h1>Notifications</h1>
<div id="list"></div>

<script>
fetch("/api/notifications?user_id="+localStorage.getItem("user_id"))
.then(r=>r.json())
.then(d=>{
list.innerHTML=JSON.stringify(d.data||[]);
});
</script>

<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
</body>
</html>
