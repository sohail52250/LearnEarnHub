<!DOCTYPE html>
<html>

<head>
<meta name="description" content="LearnEarnHub - Learn skills, find opportunities, earn online, and grow your career.">
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:title" content="LearnEarnHub">
<meta property="og:description" content="Learn, Earn and Grow.">
<link rel="canonical" href="https://learn-earnhub.vercel.app/">

<title>Investment AI Copilot</title>

<meta charset="UTF-8">

<style>

.card{
border:1px solid #ddd;
padding:20px;
margin:10px;
border-radius:12px;
}

</style>

<link rel="stylesheet" href="/components/leh-design-system.css">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#0f172a">
<link rel="stylesheet" href="/assets/css/learn-earnhub-ui.css">
</head>


<body><div id="global-header"></div>


<h1>🤖 Investment AI Copilot</h1>


<div class="card">

<input id="question"
placeholder="Ask about portfolio, deals, risk...">


<button onclick="askAI()">
Ask AI
</button>


</div>


<div class="card">

<h2>AI Response</h2>

<pre id="answer">
</pre>

</div>



<script>


async function askAI(){


let r=await fetch("/api/investment-ai-copilot",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

investor_id:
localStorage.getItem("user_id"),

question:
question.value

})

});


let d=await r.json();


answer.innerHTML=d.response;


}


</script>


<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
</body>

</html>
