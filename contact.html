<title>Contact Learn & Earn Hub</title>

<body>

<h1>Contact Us</h1>

<p>
For questions, feedback, and support, please contact our team through the available support channels.
</p>

<a href="/">Home</a>

<button id="google-signin" style="padding:10px; font-size:16px;">Sign in with Google</button>
<script src=""https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/supabase.min.js""></script>
<script>
  const supabase = supabase.createClient('seKey');', '  document.getElementById('google-signin').onclick = () => {
    supabase.auth.signIn({ provider: 'google' });
  };
  supabase.auth.getSession().then(({ data: { session } }) => {
    if (session) {
      window.location.href = 'dashboard.html';
    }
  });
</script>
</body>
