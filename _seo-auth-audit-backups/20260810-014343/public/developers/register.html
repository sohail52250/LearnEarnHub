<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Developer Registration — LearnEarnHub</title>
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>

<header class="site-header">
<div class="container nav">

<a class="brand" href="/">
<span class="brand-mark">L</span>
<span>LearnEarnHub</span>
</a>

<nav class="nav-links">
<a href="/learning/">Learning</a>
<a href="/businesses/">Businesses</a>
<a href="/corporate/">Corporate</a>
<a href="/developers/">Developers</a>
</nav>

<div class="nav-actions">
<a class="btn btn-secondary" href="/auth/sign-in.html">Sign in</a>
<a class="btn btn-primary" href="/auth/create-account.html">Create account</a>
</div>

</div>
</header>

<main class="page">
<div class="container">

<div class="page-header">
<span class="eyebrow">Developer access</span>
<h1>Build with LearnEarnHub.</h1>
<p>Register as a developer and prepare for future API and integration capabilities.</p>
</div>

<div class="form-card">
<div class="form-group">
<label>Name</label>
<input placeholder="Your name">
</div>
<div class="form-group">
<label>Email</label>
<input type="email" placeholder="you@example.com">
</div>
<div class="form-group">
<label>Project or company</label>
<input placeholder="Project name">
</div>
<button class="btn btn-primary">Create developer profile</button>
</div>

</div>
</main>

<footer class="footer">
<div class="container">
<p>© <span data-year></span> LearnEarnHub. Learn. Build. Earn. Grow.</p>
</div>
</footer>

<script src="/assets/js/app.js"></script>
</body>
</html>
