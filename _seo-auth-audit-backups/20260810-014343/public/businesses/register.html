<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register Business — LearnEarnHub</title>
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>

<header class="site-header">
<div class="container nav">

<a class="brand" href="/">
<span class="brand-mark">L</span>
<span>LearnEarnHub</span>
</a>

<nav class="nav-links">
<a href="/learning/">Learning</a>
<a href="/businesses/">Businesses</a>
<a href="/corporate/">Corporate</a>
<a href="/developers/">Developers</a>
</nav>

<div class="nav-actions">
<a class="btn btn-secondary" href="/auth/sign-in.html">Sign in</a>
<a class="btn btn-primary" href="/auth/create-account.html">Create account</a>
</div>

</div>
</header>

<main class="page">
<div class="container">

<div class="page-header">
<span class="eyebrow">Business registration</span>
<h1>Create your business presence.</h1>
<p>Register a business profile that can later manage tasks, jobs and opportunities.</p>
</div>

<div class="form-card">
<div class="form-group">
<label>Business name</label>
<input placeholder="Your business name">
</div>
<div class="form-group">
<label>Business category</label>
<select>
<option>Select a category</option>
<option>Services</option>
<option>Retail</option>
<option>Technology</option>
<option>Education</option>
<option>Other</option>
</select>
</div>
<div class="form-group">
<label>Description</label>
<textarea rows="5" placeholder="Tell people about your business"></textarea>
</div>
<button class="btn btn-primary">Continue registration</button>
</div>

</div>
</main>

<footer class="footer">
<div class="container">
<p>© <span data-year></span> LearnEarnHub. Learn. Build. Earn. Grow.</p>
</div>
</footer>

<script src="/assets/js/app.js"></script>
</body>
</html>
