<!DOCTYPE html>
<html>

<head>
<meta name="description" content="LearnEarnHub - Learn skills, find opportunities, earn online, and grow your career.">
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:title" content="LearnEarnHub">
<meta property="og:description" content="Learn, Earn and Grow.">
<link rel="canonical" href="https://learn-earnhub.vercel.app/">

<title>Investment Dashboard</title>

<meta charset="UTF-8">

<style>

.card{
border:1px solid #ddd;
padding:20px;
margin:10px;
border-radius:12px;
}

</style>

<link rel="stylesheet" href="/components/leh-design-system.css">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#0f172a">
<link rel="stylesheet" href="/assets/css/learn-earnhub-ui.css">
</head>


<body><div id="global-header"></div>


<h1>
📈 Investor Portfolio Dashboard
</h1>


<div id="summary">
Loading...
</div>


<div id="list">
</div>



<script>


let investor_id=

localStorage.getItem("user_id");



fetch(
"/api/investment-dashboard?investor_id="+investor_id
)

.then(r=>r.json())

.then(d=>{


summary.innerHTML=`

<div class="card">

<h3>Total Investment</h3>

${d.portfolio.total_investment}

</div>


<div class="card">

<h3>Total Returns</h3>

${d.portfolio.total_returns}

</div>


<div class="card">

<h3>Active Investments</h3>

${d.portfolio.active_investments}

</div>

`;



list.innerHTML=

(d.investments||[])

.map(i=>`

<div class="card">

Business:
${i.business_id}

<br>

Amount:
${i.amount}

<br>

Status:
${i.status}

</div>

`)

.join("");

});


</script>


<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
<script src="/assets/js/theme-helper.js"></script>
</body>

</html>
