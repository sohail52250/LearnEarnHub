<!DOCTYPE html>
<html>

<head>
<meta name="description" content="LearnEarnHub - Learn skills, find opportunities, earn online, and grow your career.">
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:title" content="LearnEarnHub">
<meta property="og:description" content="Learn, Earn and Grow.">
<link rel="canonical" href="https://learn-earnhub.vercel.app/">

<title>AI Business Valuation</title>

<meta charset="UTF-8">

<style>

.card{
border:1px solid #ddd;
padding:15px;
margin:10px;
border-radius:12px;
}

</style>

<link rel="stylesheet" href="/components/leh-design-system.css">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#0f172a">
<link rel="stylesheet" href="/assets/css/learn-earnhub-ui.css">
</head>


<body><div id="global-header"></div>


<h1>📊 AI Business Valuation Engine</h1>


<div class="card">


<input id="business_id"
placeholder="Business ID">


<input id="revenue"
placeholder="Annual Revenue">


<input id="profit"
placeholder="Annual Profit">


<input id="assets"
placeholder="Assets Value">


<input id="risk_score"
placeholder="Risk Score 0-100">


<button onclick="calculate()">
Generate Valuation
</button>


</div>


<div class="card">

<h2>
AI Report
</h2>

<pre id="report">
</pre>

</div>



<script>


async function calculate(){


let r=await fetch("/api/ai-valuation",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

business_id:business_id.value,

revenue:revenue.value,

profit:profit.value,

assets:assets.value,

risk_score:risk_score.value

})

});


let d=await r.json();


report.innerHTML=d.report;


}


</script>


<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
<script src="/assets/js/theme-helper.js"></script>
</body>

</html>
