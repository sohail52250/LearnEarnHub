<!DOCTYPE html>
<html>

<head>
<meta name="description" content="LearnEarnHub - Learn skills, find opportunities, earn online, and grow your career.">
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:title" content="LearnEarnHub">
<meta property="og:description" content="Learn, Earn and Grow.">
<link rel="canonical" href="https://learn-earnhub.vercel.app/">

<title>Investment Compliance Center</title>

<meta charset="UTF-8">

<style>

.card{
border:1px solid #ddd;
padding:20px;
margin:10px;
border-radius:12px;
}

</style>

<link rel="stylesheet" href="/components/leh-design-system.css">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#0f172a">
<link rel="stylesheet" href="/assets/css/learn-earnhub-ui.css">
</head>

<body><div id="global-header"></div>

<h1>🏛 Investment Compliance Center</h1>


<div class="card">

<h2>
Investor Verification
</h2>

<pre id="verification">
Loading...
</pre>

</div>


<div class="card">

<h2>
Compliance Documents
</h2>

<pre id="documents">
Loading...
</pre>

</div>


<script>

let investor_id =
localStorage.getItem("user_id");


fetch(
"/api/investment-compliance?investor_id="+investor_id
)

.then(r=>r.json())

.then(d=>{

verification.innerHTML=
JSON.stringify(d.verification,null,2);


documents.innerHTML=
JSON.stringify(d.documents,null,2);

});

</script>


<div id="global-footer"></div><script src="/global-layout.js"></script><script src="/js/role-guard.js"></script>
<script src="/assets/js/theme-helper.js"></script>
</body>

</html>
