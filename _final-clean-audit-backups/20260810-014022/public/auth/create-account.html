<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Account — LearnEarnHub</title>
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>

<header class="site-header">
<div class="container nav">

<a class="brand" href="/">
<span class="brand-mark">L</span>
<span>LearnEarnHub</span>
</a>

<nav class="nav-links">
<a href="/learning/">Learning</a>
<a href="/businesses/">Businesses</a>
<a href="/corporate/">Corporate</a>
<a href="/developers/">Developers</a>
</nav>

<div class="nav-actions">
<a class="btn btn-secondary" href="/auth/sign-in.html">Sign in</a>
<a class="btn btn-primary" href="/auth/create-account.html">Create account</a>
</div>

</div>
</header>

<main class="page">
<div class="container">

<div class="page-header">
<span class="eyebrow">Account registration</span>
<h1>Create one account for LearnEarnHub.</h1>
<p>Use one account to access learning, business, corporate and developer experiences.</p>
</div>

<div class="auth-wrap">
<div class="form-card">

<div class="form-group">
<label>Full name</label>
<input autocomplete="name" placeholder="Your name">
</div>

<div class="form-group">
<label>Email</label>
<input type="email" autocomplete="email" placeholder="you@example.com">
</div>

<div class="form-group">
<label>Password</label>
<input type="password" autocomplete="new-password" placeholder="Create a password">
</div>

<div class="form-group">
<label>Primary purpose</label>
<select>
<option>Learning</option>
<option>Business</option>
<option>Corporate</option>
<option>Developer</option>
</select>
</div>

<button class="btn btn-primary" style="width:100%">Create account</button>

<p>
Already have an account?
<a class="card-link" href="/auth/sign-in.html">Sign in</a>
</p>

</div>
</div>

</div>
</main>

<footer class="footer">
<div class="container">
<p>© <span data-year></span> LearnEarnHub. Learn. Build. Earn. Grow.</p>
</div>
</footer>

<script src="/assets/js/app.js"></script>
</body>
</html>
